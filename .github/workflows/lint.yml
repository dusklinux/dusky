name: lint

# Dusky is shell + Python + config, so CI checks the things that actually break
# users: broken syntax in a script that ships straight into $HOME, and CRLF line
# endings that make a script unexecutable on Arch.
#
# Every job here passes on the current tree. If one goes red, it found something.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # Scripts that read their own source as data — e.g.
  #   selected=$(sed '1,/^# # DATA # #$/d' "$0" | rofi -dmenu)
  # They `exit` before the data section, so bash never parses it at runtime, but
  # `bash -n` reads the whole file and false-positives on the data. Valid idiom,
  # not a bug. Add to this list only for genuine self-data scripts.
  SELF_DATA_SCRIPTS: "user_scripts/rofi/emoji.sh"

jobs:
  line-endings:
    name: line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any tracked file has CRLF
        run: |
          set -euo pipefail
          # .gitattributes pins everything to LF. This job is the enforcement.
          # A shell script committed with CRLF does not degrade gracefully — it
          # dies at exec time on the user's machine with:
          #     /usr/bin/env: 'bash\r': No such file or directory
          # `git ls-files --eol` emits:  i/<eol> w/<eol> attr/<attrs> \t <path>
          # The attr column contains spaces, and paths may too, so split on the
          # tab rather than on whitespace.
          bad=$(git ls-files --eol | awk -F'\t' '$1 ~ /^i\/(crlf|mixed)/ { print $2 }')
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings found in tracked files."
            printf '%s\n' "$bad" | while IFS= read -r f; do
              echo "::error file=$f::CRLF line endings — must be LF"
            done
            echo
            echo "Fix with:"
            echo "  git add --renormalize ."
            exit 1
          fi
          echo "✓ All tracked files use LF."

  shell-syntax:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every tracked shell script
        run: |
          set -uo pipefail
          fail=0
          total=0
          while IFS= read -r f; do
            skip=0
            for s in $SELF_DATA_SCRIPTS; do
              [ "$f" = "$s" ] && skip=1
            done
            [ "$skip" = "1" ] && continue

            total=$((total + 1))
            # -O extglob: several scripts `shopt -s extglob` at runtime and use
            # +(...) / !(...) patterns. `bash -n` does not execute the shopt, so
            # without this flag valid extglob code is reported as a syntax error.
            if ! out=$(bash -O extglob -n "$f" 2>&1); then
              fail=$((fail + 1))
              echo "::error file=$f::$out"
            fi
          done < <(git ls-files '*.sh')

          echo "Checked $total shell scripts, $fail with syntax errors."
          [ "$fail" -eq 0 ]

  shellcheck:
    name: shellcheck (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ShellCheck files touched by this PR
        run: |
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.sh' || true)

          if [ -z "$changed" ]; then
            echo "No shell scripts changed in this PR."
            exit 0
          fi

          echo "Changed shell scripts:"
          printf '%s\n' "$changed"
          echo

          # --severity=error only. Errors are near-always real defects. Warnings
          # and style notes are reported by the advisory full-repo job below, so
          # a small PR touching a long legacy script is not ambushed by the
          # pre-existing backlog.
          rc=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            shellcheck --severity=error --format=gcc "$f" || rc=1
          done <<< "$changed"
          exit "$rc"

  shellcheck-full:
    name: shellcheck (full, advisory)
    runs-on: ubuntu-latest
    # Never blocks a merge. This is a standing report of the warning backlog so
    # it can be chipped away at, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Full-repo ShellCheck report
        run: |
          set -uo pipefail
          git ls-files '*.sh' > /tmp/scripts.txt
          echo "Scanning $(wc -l < /tmp/scripts.txt) shell scripts at warning severity."
          echo
          rc=0
          while IFS= read -r f; do
            shellcheck --severity=warning --format=gcc "$f" || rc=1
          done < /tmp/scripts.txt

          echo
          echo "Advisory only — this job does not block merges."
          exit "$rc"

  python-syntax:
    name: python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: py_compile on every tracked Python file
        run: |
          set -uo pipefail
          fail=0
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            if ! out=$(python -m py_compile "$f" 2>&1); then
              fail=$((fail + 1))
              echo "::error file=$f::$out"
            fi
          done < <(git ls-files '*.py')

          echo "Checked $total Python files, $fail with syntax errors."
          [ "$fail" -eq 0 ]

  workflow-summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [line-endings, shell-syntax, python-syntax]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "### Dusky lint results"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Line endings (LF only) | ${{ needs.line-endings.result }} |"
            echo "| Shell syntax (\`bash -n\`) | ${{ needs.shell-syntax.result }} |"
            echo "| Python syntax (\`py_compile\`) | ${{ needs.python-syntax.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
