# General
title=${media-title} - Dusky Player
keep-open=yes
# Keep the native player controls available for audio without cover art.
force-window=yes
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid
autofit-larger=90%x90%

# Dusky Player supplies controls and window decorations.
osc=no
load-context-menu=no
load-select=no
osd-bar=no
border=no
# Native Wayland clipboard stays current for menu paste operations.
clipboard-monitor=yes
input-ipc-server=/tmp/mpv.sock

# Use mpv 0.42+ libcurl backend for HTTP/2, HTTP/3, and connection reuse.
curl-enabled=yes

# Wayland/EGL rendering; dynamic hardware decoding hierarchy is resolved at startup
# by scripts/hwdec_topology.lua (auto-adapts across hybrid laptops, MUX switch, and desktops).
# gpu-api=opengl keeps rendering on Mesa EGL so Vulkan ICD enumeration never wakes a D3cold dGPU.
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
hwdec=vaapi

# Tier 1 Motion: Zero-overhead display-sync temporal resampling (eliminates judder without artifacts).
# Managed atomically with Tier 2 (VapourSynth frame multiplication) via scripts/motion_tier.lua.
video-sync=display-resample
interpolation=yes
tscale=oversample
tscale-clamp=0.0

# Retain the existing scaling quality settings.
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
dither-depth=8

# mpv creates this directory on the first screenshot.
screenshot-format=png
screenshot-dir=~/Pictures/Screenshots
