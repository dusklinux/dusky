# General
title=${media-title} - Dusky Player
keep-open=yes
# Keep the native player controls available for audio without cover art.
force-window=yes
save-position-on-quit=yes
autofit-larger=90%x90%

# Dusky Player supplies controls and window decorations.
osc=no
osd-bar=no
border=no
# Native Wayland clipboard stays current for menu paste operations.
clipboard-monitor=yes

# Wayland/EGL rendering; dynamic hardware decoding hierarchy is resolved at startup
# by scripts/hwdec_topology.lua (auto-adapts across hybrid laptops, MUX switch, and desktops).
vo=gpu
gpu-context=wayland
hwdec=vaapi

# Retain the existing scaling quality settings.
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
dither-depth=auto

# mpv creates this directory on the first screenshot.
screenshot-format=png
screenshot-dir=~/Pictures/Screenshots
