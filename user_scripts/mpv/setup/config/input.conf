# Playback and Dusky Player indicators
SPACE        cycle pause; script-binding dusky_player/flash-pause-indicator
m            no-osd cycle mute; script-binding dusky_player/flash-volume
RIGHT        seek  5
LEFT         seek -5
Shift+RIGHT  seek  30; script-binding dusky_player/flash-timeline
Shift+LEFT   seek -30; script-binding dusky_player/flash-timeline
UP           no-osd add volume  5; script-binding dusky_player/flash-volume
DOWN         no-osd add volume -5; script-binding dusky_player/flash-volume
TAB          script-binding dusky_player/toggle-ui
MENU         script-binding dusky_player/menu
MBTN_RIGHT   script-binding dusky_player/menu

# A compact context menu. Other mpv default bindings remain available.
Ctrl+o       script-binding dusky_player/open-file       #! Open file
Ctrl+s       script-binding dusky_silence/toggle         #! Trim silence on/off (audio)
Alt+s        script-binding dusky_silence/cycle          #! Trim silence level (audio)
