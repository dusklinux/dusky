# Playback and Dusky Player indicators
SPACE        cycle pause; script-binding dusky_player/flash-pause-indicator
m            no-osd cycle mute; script-binding dusky_player/flash-volume
RIGHT        seek  5
LEFT         seek -5
Shift+RIGHT  seek  30; script-binding dusky_player/flash-timeline
Shift+LEFT   seek -30; script-binding dusky_player/flash-timeline
UP           no-osd add volume  5; script-binding dusky_player/flash-volume
DOWN         no-osd add volume -5; script-binding dusky_player/flash-volume
TAB          script-binding dusky_player/toggle-ui
MENU         script-binding dusky_player/menu
MBTN_RIGHT   script-binding dusky_player/menu

# A compact context menu. Other mpv default bindings remain available.
Ctrl+o       script-binding dusky_player/open-file       #! Open file
Ctrl+s       script-binding dusky_silence/toggle         #! Trim silence on/off (audio)
Alt+s        script-binding dusky_silence/cycle          #! Trim silence level (audio)
Ctrl+w       script-binding dusky_player/toggle-waveform #! Audio waveform on/off
#            script-binding dusky_player/items           #! Playlist / Files
#            script-binding dusky_player/chapters        #! Chapters
#            script-binding dusky_player/subtitles       #! Subtitles
#            script-binding dusky_player/audio           #! Audio tracks
#            script-binding dusky_player/stream-quality  #! Stream quality
#            script-binding dusky_player/audio-device    #! Audio device
#            script-binding dusky_player/editions        #! Editions
s            screenshot                         #! Screenshot
#            script-binding dusky_player/keybinds        #! Key bindings
#            quit                               #! Quit

# Headphone / Hardware Media Keys (Seek N seconds or Next/Prev item per dusky_player.conf)
NEXT            script-binding dusky_player/media-next
PREV            script-binding dusky_player/media-prev
XF86_NEXT       script-binding dusky_player/media-next
XF86_PREV       script-binding dusky_player/media-prev
FORWARD         script-binding dusky_player/media-next
REWIND          script-binding dusky_player/media-prev
Ctrl+m          script-binding dusky_player/cycle-media-keys-mode     #! Navigation > Toggle headphone seek / episode mode

# Playback Memory & Watch-Later Clearing
Ctrl+h          script-binding dusky_player/clear-history             #! Playback Memory > Open playback memory menu...
Ctrl+Shift+h    script-binding dusky_player/clear-directory-history   #! Playback Memory > Clear current folder memory & restart

