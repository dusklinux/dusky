# Proximity animations with a compact control bar.
# Extra actions remain accessible through the right-click menu and key bindings.
controls=menu,gap,play-pause,<has_playlist>prev,items,<has_playlist>next,space,<video,audio>speed,space,<has_sub>subtitles,<has_many_audio>audio,<has_chapter>chapters,gap,fullscreen
# Whole-track waveform inside the audio timeline. Ctrl+w toggles for this session.
# Requires one background FFmpeg decode per track; disabled by default.
# Local, finite audio files only (cover art allowed). Source audio, before filters.
# External audio, virtual inputs and ambiguous non-lavf tracks are skipped.
timeline_waveform=no
