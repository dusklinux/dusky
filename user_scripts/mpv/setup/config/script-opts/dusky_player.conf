# Proximity animations with a compact control bar.
# Extra actions remain accessible through the right-click menu and key bindings.
controls=menu,gap,play-pause,<has_playlist>prev,items,<has_playlist>next,clear-history,space,<video,audio>speed,space,<has_sub>subtitles,<has_many_audio>audio,<has_chapter>chapters,gap,fullscreen
# Whole-track waveform inside the audio timeline. Ctrl+w toggles for this session.
# Requires one background FFmpeg decode per track; disabled by default.
# Local, finite audio files only (cover art allowed). Source audio, before filters.
# External audio, virtual inputs and ambiguous non-lavf tracks are skipped.
timeline_waveform=no
# Matugen palette is discovered through XDG_CONFIG_HOME (or ~/.config).
# theme_path= disables palette loading; color= overrides individual UI colors.

# Automatically play the next playable file in the current directory when a file ends,
# without adding directory files into the intentional playlist queue.
autoload=yes

# Headphone / media button behavior (NEXT, PREV, XF86_NEXT, XF86_PREV, FORWARD, REWIND):
# - media_keys_mode=seek      -> jump forward/backward by media_keys_step seconds (flashes timeline)
# - media_keys_mode=navigate  -> switch to next/previous episode or track (playlist or folder)
media_keys_mode=seek
# Seek step in seconds when media_keys_mode=seek (e.g. 15, 30, 45, 60, or 30! for exact seek).
media_keys_step=30
