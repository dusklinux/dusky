[project]
name = "dusky-keylogger"
version = "2.0.0"
description = "Dusky Keylogger -- always-on keystroke statistics daemon with live dashboard"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "evdev>=2.0.0",
    "rich>=14.0",
]

[project.scripts]
dusky = "dusky_keylogger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dusky_keylogger"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
