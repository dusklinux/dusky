[package]
name = "dusky-network"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Persistent Linux network meter for Waybar"

# No crates: installation and builds work completely offline.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
