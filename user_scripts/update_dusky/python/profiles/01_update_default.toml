# ==============================================================================
# Dusky Updater Default Profile
# Path: profiles/01_update_default.toml
# ==============================================================================
[profile]
name = "subscripts"
description = "dusky update scripts"
version = "9.5.0"

[git]
repo_url = "https://github.com/dusklinux/dusky"
branch = "main"

# Topologically decoupled search heuristics replacing static path dictionaries
search_dirs = [
    "user_scripts/arch_setup_scripts/scripts",
    "user_scripts/arch_setup_scripts",
    "user_scripts/cursor/color",
    "user_scripts/networking",
    "user_scripts/misc_extra",
    "user_scripts/misc_extra/delete_in_3_weeks",
    "user_scripts/update_dusky/update_checker",
    "user_scripts/dusky_system/reload_cc",
    "user_scripts/services",
    "user_scripts/update_dusky",
    "user_scripts/rofi",
    "user_scripts/images",
    "user_scripts/theme_matugen/config",
    "user_scripts/firefox/theme_matugen",
    "user_scripts/firefox",
    "user_scripts/theme_matugen",
    "user_scripts/waybar",
    "user_scripts/tts_stt/dusky_kokoro",
    "user_scripts/tts_stt/dusky_parakeet",
    "user_scripts/starship",
    "user_scripts/keylogger",
]

[conflict_resolutions]
# "update_checker.sh" = "user_scripts/update_dusky/update_checker.sh"

# ==============================================================================
# Update sequence tasks format:
#   Mode | Flags | Script Name & Arguments
#
# Field 1 (Mode):
#   U = Run as user
#   S = Run with elevated sudo privileges
#
# Field 2 (Optional Flags):
#   ignore-fail         Suppress script failure exit codes
#   interactive         Pass raw terminal TTY control for interactive scripts
#   once, once:content  Re-run when the script content changes
#   once:forever        Never re-run once completed
#   once:sealed         Never re-run; notify once when the script content changes
#   if:<condition>      Conditional execution (e.g., if:wayland, if:gpu:nvidia, if:pkg:hyprland)
#   timeout:<seconds>   Per-task execution timeout in seconds
#   retry:<count>       Retry attempts on task failure
#   retry_delay:<secs>  Seconds to wait between retry attempts
# ==============================================================================
