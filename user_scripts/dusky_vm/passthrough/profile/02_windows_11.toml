[profile]
name = "Windows 11"
description = "Existing Windows VFIO/Looking Glass workflow; guest modernization is separate"

[search_dirs]
dirs = ["."]

[sequence]
tasks = [
    { script = "05_virtio_iso.py", args = ["--virtio"] },
    { script = "07_storage_setup.py" },
    { script = "10_virt_modular_daemon.py" },
    { script = "15_gpu_probing_kernal_param_mkinit.py" },
    { script = "20_networking_nmcli.py" },
    { script = "25_looking_glass.py" },
    { script = "30_kvm_vm_deploy.py", args = ["--windows"], always = true, forward_args = true },
]
