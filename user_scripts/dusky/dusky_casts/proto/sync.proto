// Subset of the Pocket Casts sync protocol used by Dusk Casts.
// Field numbers and wrapper types are taken from the iOS generated sources
// (Modules/Sources/PocketCastsServer/Private/Protobuffer/api.pb.swift).
// Unknown record types are ignored by protobuf and by the client.
syntax = "proto3";

package dusksync;

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Int32Value { int32 value = 1; }
message Int64Value { int64 value = 1; }
message BoolValue { bool value = 1; }
message StringValue { string value = 1; }

message UpdateEpisodeRequest {
  string uuid = 1;
  string podcast = 2;
  Int32Value position = 3;
  int32 status = 4;
  int32 duration = 5;
}

message UpdateEpisodeStarRequest {
  string uuid = 1;
  string podcast = 2;
  bool star = 3;
}

message SyncUserEpisode {
  string uuid = 1;
  string podcast_uuid = 2;
  BoolValue is_deleted = 3;
  Int64Value is_deleted_modified = 4;
  Int64Value duration = 5;
  Int64Value duration_modified = 6;
  Int32Value playing_status = 7;
  Int64Value playing_status_modified = 8;
  Int64Value played_up_to = 9;
  Int64Value played_up_to_modified = 10;
  BoolValue starred = 11;
  Int64Value starred_modified = 12;
}

message SyncUserPodcast {
  string uuid = 1;
  BoolValue is_deleted = 2;
  BoolValue subscribed = 3;
  StringValue folder_uuid = 7;
  Int32Value sort_position = 8;
  Timestamp date_added = 9;
}

message SyncPlaylistEpisode {
  string episode = 1;
  string podcast = 2;
  Int64Value added = 3;
  Timestamp published = 4;
  StringValue title = 5;
  StringValue url = 6;
  StringValue podcast_slug = 7;
  StringValue episode_slug = 8;
}

message SyncUserPlaylist {
  string uuid = 1;
  BoolValue is_deleted = 2;
  StringValue title = 3;
  BoolValue all_podcasts = 4;
  StringValue podcast_uuids = 5;
  StringValue episode_uuids = 6;
  Int32Value audio_video = 7;
  BoolValue not_downloaded = 8;
  BoolValue downloaded = 9;
  BoolValue downloading = 10;
  BoolValue finished = 11;
  BoolValue partially_played = 12;
  BoolValue unplayed = 13;
  BoolValue starred = 14;
  BoolValue manual = 15;
  Int32Value sort_position = 16;
  Int32Value sort_type = 17;
  Int32Value icon_id = 18;
  Int32Value filter_hours = 19;
  string original_uuid = 20;
  BoolValue filter_duration = 21;
  Int32Value longer_than = 22;
  Int32Value shorter_than = 23;
  repeated string episode_order = 24;
  repeated SyncPlaylistEpisode episodes = 25;
  BoolValue show_archived = 26;
}

message SyncUserFolder {
  string folder_uuid = 1;
  bool is_deleted = 2;
  string name = 3;
  int32 color = 4;
  int32 sort_position = 5;
  int32 podcasts_sort_type = 6;
  Timestamp date_added = 7;
}

// Device statistics use cumulative seconds, not per-sync increments.
message SyncUserDevice {
  StringValue device_id = 1;
  Int32Value device_type = 2;
  Int64Value times_started_at = 3;
  Int64Value time_silence_removal = 4;
  Int64Value time_variable_speed = 5;
  Int64Value time_intro_skipping = 6;
  Int64Value time_skipping = 7;
  Int64Value time_listened = 8;
}

message Record {
  oneof record {
    SyncUserPodcast podcast = 1;
    SyncUserEpisode episode = 2;
    SyncUserPlaylist playlist = 3;
    SyncUserDevice device = 4;
    SyncUserFolder folder = 5;
  }
}

message SyncUpdateRequest {
  int64 device_utc_time_ms = 1;
  int64 last_modified = 2;
  string country = 3;
  string device_id = 4;
  repeated Record records = 5;
  Int32Value device_type = 6;
}

message SyncUpdateResponse {
  int64 last_modified = 1;
  repeated Record records = 2;
}

// ------------------------------------------------------------------ Up Next
// Up Next is a separate endpoint and change log. The server returns the
// authoritative ordered queue; local actions are merged into that list.

message UpNextEpisodeRequest {
  string uuid = 1;
  string title = 4;
  string url = 5;
  string podcast = 6;
  Timestamp published = 7;
}

message UpNextChanges {
  message Change {
    string uuid = 1;
    int32 action = 2;
    int64 modified = 3;
    string title = 4;
    string url = 5;
    string podcast = 6;
    repeated UpNextEpisodeRequest episodes = 7;
    Timestamp published = 8;
  }
  int64 server_modified = 1;
  repeated Change changes = 2;
  repeated string order = 3;
}

message UpNextSyncRequest {
  int64 device_time = 1;
  string version = 2;
  string model = 3;
  UpNextChanges up_next = 4;
  bool show_play_status = 5;
  string device_id = 6;
}

message UpNextResponse {
  message EpisodeResponse {
    string title = 1;
    string url = 2;
    string podcast = 3;
    string uuid = 4;
    Timestamp published = 5;
  }
  message EpisodeSyncResponse {
    string uuid = 1;
    Int64Value played_up_to = 6;
    Int64Value duration = 7;
  }
  int64 server_modified = 1;
  repeated EpisodeResponse episodes = 4;
  repeated EpisodeSyncResponse episode_sync = 5;
}
