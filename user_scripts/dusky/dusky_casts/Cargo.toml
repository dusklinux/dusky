[package]
name = "dusky_casts"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
description = "Wayland podcast and local audio client with Pocket Casts sync and mpv playback"

[[bin]]
name = "dusky_casts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
feed-rs = "3.0"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "tokio", "image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
prost = "0.14"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "gzip"] }
rusqlite = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4", "v5"] }

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
