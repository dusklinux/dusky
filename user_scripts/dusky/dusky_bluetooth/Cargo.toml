[package]
name = "dusky_bluetooth"
version = "1.0.0"
edition = "2024"
authors = ["Dusk Linux"]
description = "Dusky Bluetooth: Native Rust Bluetooth manager for Arch Linux / Hyprland (Iced + Wayland xdg-toplevel) with BlueZ D-Bus integration and dynamic Matugen theming."

[[bin]]
name = "dusky_bluetooth"
path = "src/main.rs"

[dependencies]
iced_graphics = "0.14.0"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "wayland", "svg", "advanced", "thread-pool"] }
iced_core = "0.14.0"
iced_futures = { version = "0.14.0", features = ["thread-pool"] }
iced_runtime = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["wgpu-bare"] }
iced_widget = { version = "0.14.2", features = ["advanced", "svg", "wgpu"] }
iced_wgpu = { version = "0.14.0", default-features = false }
# Enable Vulkan and Wayland EGL explicitly for adapter selection.
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "parking_lot"] }
futures-timer = "3.0.4"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[patch.crates-io]
fontdb = { path = "../../rust_shared/fontdb" }
