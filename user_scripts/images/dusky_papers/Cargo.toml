[package]
name = "dusky-papers"
version = "1.1.0"
edition = "2024"
authors = ["Dusk Linux"]
description = "Dusky Papers: fast, lightweight wallpapers for Arch Linux / Hyprland"

[dependencies]
iced_graphics = "0.14.0"
iced_core = "0.14.0"
iced_futures = { version = "0.14.0", features = ["thread-pool"] }
iced_runtime = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["wgpu-bare"] }
iced_widget = { version = "0.14.2", features = ["advanced", "image", "wgpu"] }
iced_wgpu = { version = "0.14.0", default-features = false }
# Enable Vulkan and Wayland EGL explicitly for adapter selection.
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "parking_lot"] }
iced_exwlshell = { version = "0.20.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rayon = "1.12.0"
fastrand = "2.5.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The layer-shell crate enables window_clipboard defaults, including X11.
# Keep its existing API with only the Wayland implementation.
[patch.crates-io]
fontdb = { path = "../../rust_shared/fontdb" }
window_clipboard = { path = "src/wayland_clipboard" }
