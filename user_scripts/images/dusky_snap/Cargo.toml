[package]
name = "dusky_snap"
version = "0.4.1"
edition = "2024"
description = "Minimal Wayland screenshot and annotation tool for Dusky / Hyprland"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu-bare", "tiny-skia", "wayland", "canvas", "image-without-codecs", "advanced", "thread-pool", "fira-sans"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "parking_lot"] }
tiny-skia = "0.11.4"
cosmic-text = "0.15.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libwayshot = { version = "0.9.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.18.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-timer = "3.0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
