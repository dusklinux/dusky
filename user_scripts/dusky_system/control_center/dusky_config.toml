[[pages]]
id = "home"
title = "Home"
icon = "user-home-symbolic"

[[pages.layout]]
type = "grid_section"
[pages.layout.properties]
title = ""

[[pages.layout.items]]
type = "toggle_card"
[pages.layout.items.properties]
title = "Bluetooth"
icon = "bluetooth-active-symbolic"
state_command = "rfkill list bluetooth | grep -q 'Soft blocked: no' && echo yes"
interval = 5
[pages.layout.items.on_toggle.enabled]
type = "exec"
command = "rfkill unblock bluetooth && notify-send 'Bluetooth' 'Bluetooth Turned ON'"
terminal = false
[pages.layout.items.on_toggle.disabled]
type = "exec"
command = "rfkill block bluetooth && notify-send 'Bluetooth' 'Bluetooth Turned OFF'"
terminal = false

[[pages.layout.items]]
type = "toggle_card"
[pages.layout.items.properties]
title = "Wi-Fi"
icon = "network-wireless-symbolic"
state_command = "rfkill list wifi | grep -q 'Soft blocked: no' && echo yes"
interval = 5
[pages.layout.items.on_toggle.enabled]
type = "exec"
command = "rfkill unblock wifi && notify-send 'Wi-Fi' 'Wireless Radio Turned ON'"
terminal = false
[pages.layout.items.on_toggle.disabled]
type = "exec"
command = "rfkill block wifi && notify-send 'Wi-Fi' 'Wireless Radio Turned OFF'"
terminal = false


[[pages.layout.items]]
type = "toggle_card"
[pages.layout.items.properties]
title = "Dark Mode"
icon = "weather-clear-night-symbolic"
key = "dusky_theme/state"
[pages.layout.items.on_toggle.enabled]
type = "exec"
command = "$HOME/user_scripts/theme_matugen/theme_ctl.sh set --mode dark"
terminal = false
[pages.layout.items.on_toggle.disabled]
type = "exec"
command = "$HOME/user_scripts/theme_matugen/theme_ctl.sh set --mode light"
terminal = false

[[pages.layout.items]]
type = "grid_card"
[pages.layout.items.properties]
title = "Reload CC"
icon = "system-reboot-symbolic"
style = "destructive"
[pages.layout.items.on_press]
type = "exec"
command = "$HOME/user_scripts/dusky_system/reload_cc/cc_restart.sh"
terminal = false

[[pages.layout.items]]
type = "grid_card"
[pages.layout.items.properties]
title = "Dusky"
icon = "software-update-available-symbolic"
badge_file = "~/.config/dusky/settings/dusky_update_behind_commit"
button_text_file = "~/.config/dusky/settings/dusky_update_behind_commit"
button_text_map = { "0" = "Updated", "default" = "Available" }
style_map = { "0" = "default", "default" = "suggested" }
[pages.layout.items.on_press]
type = "exec"
command = "dusky-run kitty --class update_dusky.py --title \"System Updater\" --hold sh -c \"$HOME/user_scripts/update_dusky/python/update_dusky.py\""
terminal = false

[[pages.layout.items]]
type = "grid_card"
[pages.layout.items.properties]
title = "Power"
icon = "system-log-out-symbolic"
style = "destructive"
[pages.layout.items.on_press]
type = "exec"
command = "$HOME/user_scripts/wlogout/wlogout_scale.sh"
terminal = false

[[pages.layout]]
type = "section"
[pages.layout.properties]
title = "Power Management"
icon = ""
description = ""

[[pages.layout.items]]
type = "selection"
[pages.layout.items.properties]
title = "Active Profile"
description = "Select performance mode"
value_command = "~/user_scripts/battery/tlp/tlp_mode_toggle.sh status"
icon = "power-profile-balanced-symbolic"
interval = 2
options = ["Balanced", "Performance", "Power Saver"]
options_map = { "balanced" = "Balanced", "performance" = "Performance", "power-saver" = "Power Saver" }
[pages.layout.items.on_change.Balanced]
type = "exec"
command = "~/user_scripts/battery/tlp/tlp_mode_toggle.sh balanced"
[pages.layout.items.on_change.Performance]
type = "exec"
command = "~/user_scripts/battery/tlp/tlp_mode_toggle.sh performance"
[pages.layout.items.on_change."Power Saver"]
type = "exec"
command = "~/user_scripts/battery/tlp/tlp_mode_toggle.sh power-saver"

[[pages.layout]]
type = "section"
[pages.layout.properties]
title = "Quick Controls"
icon = ""
description = ""

[[pages.layout.items]]
type = "slider"
[pages.layout.items.properties]
title = "Volume"
icon = "audio-volume-high-symbolic"
min = 0.0
max = 100.0
step = 1.0
default = 50.0
debounce = false
value_command = "wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print $2 * 100}'"
interval = 2
[pages.layout.items.on_change]
type = "exec"
command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ {value}%"

[[pages.layout.items]]
type = "slider"
[pages.layout.items.properties]
title = "Brightness"
icon = "display-brightness-high-symbolic"
min = 1.0
max = 100.0
step = 1.0
default = 50.0
debounce = false
value_command = "brightnessctl -m | awk -F, '{print $4}' | tr -d %"
interval = 2
[pages.layout.items.on_change]
type = "exec"
command = "brightnessctl set {value}%"

[[pages.layout]]
type = "section"
[pages.layout.properties]
title = "Live System Status"
icon = ""
description = ""

[[pages.layout.items]]
type = "label"
[pages.layout.items.properties]
title = "Kernel"
interval = 10
[pages.layout.items.value]
type = "system"
key = "kernel_version"

[[pages.layout.items]]
type = "label"
[pages.layout.items.properties]
title = "Memory Used"
interval = 5
[pages.layout.items.value]
type = "system"
key = "memory_used"


