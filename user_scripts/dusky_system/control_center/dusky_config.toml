scope = "system"

[[pages.layout.items]]
type = "grid_card"
[pages.layout.items.properties]
title = "Keylogger TUI"
icon = "preferences-system-symbolic"
[pages.layout.items.on_press]
type = "exec"
command = "foot --app-id=dusky_tui python3 $HOME/user_scripts/keylogger/tui_keylogger.py"
terminal = false

[[pages.layout.items]]
type = "grid_card"
[pages.layout.items.properties]
title = "Dashboard"
icon = "utilities-system-monitor-symbolic"
[pages.layout.items.on_press]
type = "exec"
command = "kitty --class dusky_keylogger -e $HOME/contained_apps/uv/dusky_key_logger/bin/dusky dashboard"
terminal = false

[[pages.layout]]
type = "section"
[pages.layout.properties]
title = "Configuration"
icon = ""
description = ""

[[pages.layout.items]]
type = "button"
[pages.layout.items.properties]
title = "Generate Transcript"
description = "dusky text --period today → /tmp (ephemeral) • also visible in Dashboard Transcript tab"
icon = "document-edit-symbolic"
[pages.layout.items.on_press]
type = "exec"
command = "kitty --class dusky_keylogger_transcript --hold $HOME/contained_apps/uv/dusky_key_logger/bin/dusky text --period today"
terminal = false

[[pages.layout.items]]
type = "button"
[pages.layout.items.properties]
title = "Open Keylogger Config"
description = "~/.config/dusky/settings/keylogger/config.json (persistent, auto-created if missing)"
icon = "document-edit-symbolic"
[pages.layout.items.on_press]
type = "exec"
command = "$HOME/user_scripts/dusky_system/control_center/dusky_text_editor.py \"$HOME/.config/dusky/settings/keylogger/config.json\""
terminal = false

[[pages.layout.items]]
type = "button"
[pages.layout.items.properties]
title = "View Service Logs"
description = "journalctl -u dusky_keylogger"
icon = "utilities-terminal-symbolic"
[pages.layout.items.on_press]
type = "exec"
command = "kitty --class dusky_keylogger_logs --hold sh -c 'journalctl -u dusky_keylogger --no-pager -n 100; echo; read -p \"Press Enter to close...\"'"
terminal = false

[[pages.layout.items]]
type = "button"
[pages.layout.items.properties]
title = "Keylogger Status"
description = "dusky status (persistent DB + ephemeral dir)"
icon = "dialog-information-symbolic"
[pages.layout.items.on_press]
type = "exec"
command = "kitty --class dusky_keylogger_status --hold sh -c '$HOME/contained_apps/uv/dusky_key_logger/bin/dusky status; echo; read -p \"Press Enter to close...\"'"
terminal = false

