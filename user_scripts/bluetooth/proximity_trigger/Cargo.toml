[package]
name = "dusky_proximity"
version = "1.0.0"
edition = "2024"
authors = ["dusk"]
description = "Bluetooth proximity and connection automation for Dusky / Hyprland"

[[bin]]
name = "dusky_proximity"
path = "src/main.rs"

[dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt", "macros", "time", "process", "signal", "net", "io-util"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
