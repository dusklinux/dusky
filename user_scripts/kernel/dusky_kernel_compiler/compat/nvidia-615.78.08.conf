# DKMS override for the tested NVIDIA open driver source version only.
# Linux 7.3 isolates kthreads in nullfs; opt in to init's fs for sysfs open.
if [[ -r ${kernel_source_dir}/include/linux/fs_struct.h ]] &&
    grep -Fq '#define scoped_with_init_fs()' "${kernel_source_dir}/include/linux/fs_struct.h"; then
    case " ${PATCH[*]} " in
        *" nvidia-615.78.08-linux-7.3-rtd3.patch "*) ;;
        *) PATCH+=("nvidia-615.78.08-linux-7.3-rtd3.patch") ;;
    esac
fi
