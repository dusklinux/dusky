# Stock upstream kernel; strict target hardware census. See README.md for the workflow.

[meta]
name = "extreme_power"
description = "Aggressive power saving; sacrifices responsiveness and optional features"
suffix = "dusky-extreme-power"
priority = 80
tags = ["laptop", "power-saving"]

[cpu]
governor = "powersave"
epp = "power"
mitigations = "off"

[timing]
hz = 100

[memory]
thp = "never"
thp_defrag = "never"
mglru_min_ttl_ms = 0
zram_size_pct = 50
zram_multi_comp = false
swappiness = 60
vfs_cache_pressure = 75
watermark_scale_factor = 10
dirty_bytes_mb = 128
ksm = false
hugetlbfs = false
kallsyms_all = false
tracing = "minimal"
kexec = false

[compiler]
debug_info = "none"
rust = true

[security]
profile = "extreme"
init_on_alloc = false
hardened_usercopy = false
stackprotector = "regular"
slab_freelist_hardened = false
slab_freelist_random = false
randomize_kstack = false
ubsan_bounds = false
acknowledge_risk = true

[gaming]
uclamp = false
max_map_count = 1048576

[storage]
io_scheduler = "keep"

[power]
wq_power_efficient = true
rcu_lazy = true
pcie_aspm = "powersupersave"
hda_power_save = 1

[network]
mptcp = false
