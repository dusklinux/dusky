# Stock upstream kernel; strict target hardware census. See README.md for the workflow.

[meta]
name = "battery"
description = "Native laptop battery tuning with strict hardware census"
suffix = "dusky-battery"
priority = 60
tags = ["laptop", "battery", "mobile", "efficiency"]

[dusky]
enhanced = true

[cpu]
governor = "powersave"
amd_pstate = "undefined"
epp = "power"
mitigations = "off"

[timing]
hz = 300

[memory]
thp = "never"
thp_defrag = "never"
mglru_min_ttl_ms = 0
zram_size_pct = 50
zram_multi_comp = false
swappiness = 50
vfs_cache_pressure = 50
watermark_scale_factor = 10
dirty_bytes_mb = 480
numa = false
ksm = false
hugetlbfs = false
kallsyms_all = false
log_buf_shift = 16
kexec = false

[compiler]
rust = true

[security]
stackprotector = "none"
acknowledge_risk = true

[gaming]
uclamp = false
max_map_count = 1048576
split_lock_mitigate = true

[power]
wq_power_efficient = true
rcu_lazy = true
pcie_aspm = "powersupersave"
hda_power_save = 5
