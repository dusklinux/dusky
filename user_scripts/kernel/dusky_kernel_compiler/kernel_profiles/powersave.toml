# Stock upstream Linux 7.4+ kernel; strict target hardware census.
# Tuned for maximum desktop & laptop power efficiency without sacrificing Wayland/Hyprland smoothness.

[meta]
name = "powersave"
description = "Maximum power efficiency and deep C-state residency for laptops and desktops"
suffix = "dusky-powersave"
priority = 60
tags = ["powersave", "battery", "efficiency", "desktop", "laptop"]

[dusky]
enhanced = true

[cpu]
governor = "powersave"
amd_pstate = "active"
# balance_power (EPP 192) allows short Wayland/Hyprland bursts to finish quickly and re-enter deep C-states;
# switch to "power" (EPP 255) only if you want aggressive clock clamping over UI smoothness.
epp = "balance_power"
mitigations = "off"

[timing]
hz = 300
tickless = "idle"
preempt = "lazy"
# Must remain true: upstream PREEMPT_LAZY selects PREEMPT_DYNAMIC on x86_64 (patched inline at boot via text_poke_bp)
preempt_dynamic = true

[memory]
footprint = "lean"
# madvise avoids background khugepaged scanning while allowing explicit 2 MiB pages to cut dTLB misses
thp = "madvise"
thp_defrag = "madvise"
thp_shmem = "never"
mglru = true
mglru_min_ttl_ms = 0
zram_size_pct = 50
zram_multi_comp = false
swappiness = 50
vfs_cache_pressure = 50
watermark_scale_factor = 10
compaction_proactiveness = 0
dirty_bytes_mb = 480
# _ops_memory automatically compiles out CONFIG_NUMA on single-node machines
numa = true
numa_balancing = false
ksm = false
hugetlbfs = false
kallsyms_all = false
log_buf_shift = 16
tracing = "minimal"
kexec = false

[compiler]
optimize = "o2"
lto = "thin"
debug_info = "none"
rust = true

[security]
profile = "extreme"
init_on_alloc = false
init_on_free = false
hardened_usercopy = false
stackprotector = "none"
slab_freelist_hardened = false
slab_freelist_random = false
randomize_kstack = false
ubsan_bounds = false
acknowledge_risk = true

[gaming]
ntsync = true
uclamp = false
max_map_count = 1048576
split_lock_mitigate = true

[storage]
io_scheduler = "none"
blk_wbt = true

[power]
wq_power_efficient = true
cpu_idle_governor = "teo"
rcu_lazy = true
energy_model = false
pcie_aspm = "powersupersave"
hda_power_save = 5

[network]
congestion = "bbr"
qdisc = "fq"
mptcp = false
