# Stock upstream kernel; strict target hardware census. See README.md for the workflow.

[meta]
name = "low_memory"
description = "Small kernel and compressed swap for memory-constrained desktops"
suffix = "dusky-low-memory"
priority = 90
tags = ["low-memory", "desktop"]

[cpu]
mitigations = "off"

[timing]
hz = 250

[memory]
footprint = "minimal"
thp = "never"
thp_defrag = "never"
mglru_min_ttl_ms = 0
zram_multi_comp = false
swappiness = 160
vfs_cache_pressure = 150
watermark_scale_factor = 10
dirty_bytes_mb = 32
ksm = false
hugetlbfs = false
kallsyms_all = false
base_small = true
log_buf_shift = 15
tracing = "minimal"
kexec = false

[compiler]
optimize = "size"
debug_info = "none"
rust = true

[security]
profile = "extreme"
init_on_alloc = false
hardened_usercopy = false
stackprotector = "regular"
slab_freelist_hardened = false
slab_freelist_random = false
randomize_kstack = false
ubsan_bounds = false
acknowledge_risk = true

[gaming]
uclamp = false
max_map_count = 1048576

[storage]
io_scheduler = "keep"

[power]
wq_power_efficient = true
hibernation = false
hda_power_save = 5

[network]
mptcp = false
