# generated by Dusky Kernel Compiler 6.0.0 -- 2026-09-02
# Embedded / appliance (<= 4 GiB, headless): BASE_SMALL, SLUB_TINY, no 32-bit compat, no hibernation, NR_CPUS 8, -Os

[meta]
# Profile id (matches --profile)
name = "embedded_lowram"
# One-line summary
description = "Embedded / appliance (<= 4 GiB, headless): BASE_SMALL, SLUB_TINY, no 32-bit compat, no hibernation, NR_CPUS 8, -Os"
# LOCALVERSION suffix and pkgbase tail: linux-<suffix>
suffix = "dusky-embedded"
# Sort order in pickers
priority = 32
# Free-form labels
tags = []
# Refuse to build inside a VM and strip guest paravirt code
bare_metal_only = false
# Package targets another machine (forbids -march=native)
portable_package = false

[release]
# Upstream release channel | choices: mainline | stable | longterm
channel = "longterm"
# Exact version pin (e.g. 7.2.3 or 7.3-rc2); empty = newest in channel
pin = ""
# Allow -rc snapshot tarballs (mainline)
allow_rc = true
# Hard floor; anything older is rejected
min_version = "7.2"
# Require PGP or SHA256 verification of release tarballs
require_signature = true

[scheduler]
# Base scheduler | choices: eevdf | bore | bmq
type = "eevdf"
# sched_ext BPF scheduler daemon | choices: none | scx_lavd | scx_bpfland | scx_layered | scx_rusty | scx_flash | scx_p2dq | scx_cosmos
scx = "none"
# Flags passed to the scx daemon (e.g. --autopilot)
scx_flags = ""
# Compile CONFIG_SCHED_CLASS_EXT (+BTF/BPF JIT)
scx_enable_class = false
# Fail the build if the scheduler patch cannot be applied
require_patch = false
# Fall back to EEVDF when the patch fails
allow_vanilla_fallback = true
# SCHED_AUTOGROUP (per-session fairness)
autogroup = false
# RT_GROUP_SCHED bandwidth control
rt_group = false
# SCHED_CORE core scheduling (SMT side-channel isolation; overhead)
sched_core = false
# Ordered patch resolvers
patch_sources = ["cachyos", "upstream_author"]

[cache]
# CONFIG_SCHED_CACHE Cache-Aware Scheduling (LLC affinity)
sched_cache = true
# LLC aggregation tolerance written to debugfs at boot
llc_aggr_tolerance = 1
# LLC aggregation capacity percent (-1 = kernel default)
llc_aggr_cap = -1

[rseq]
# RSEQ time-slice extension (CONFIG_RSEQ_SLICE_EXTENSION)
slice_extension = true
# Requested slice extension in nanoseconds
slice_ext_nsec = 10000

[dusky]
# Desktop heuristics (nowatchdog, faster fbcon takeover)
enhanced = false
# KBUILD_BUILD_HOST
hostname = ""
# KBUILD_BUILD_USER
user = ""
# Fixed KBUILD_BUILD_TIMESTAMP / SOURCE_DATE_EPOCH
reproducible = true
# Seed .config source | choices: auto | snapshot | arch | running | headers | defconfig
seed = "auto"

[dusky.extra_config]
# SYMBOL = true | false | "m" | 123 | "string"   (CONFIG_ prefix optional)

[cpu]
# Target micro-architecture | choices: native | generic | generic_v2 | generic_v3 | generic_v4 | sandybridge | ivybridge | haswell | broadwell | skylake | skylake-avx512 | icelake-client | icelake-server | tigerlake | rocketlake | alderlake | raptorlake | meteorlake | arrowlake | lunarlake | sapphirerapids | emeraldrapids | graniterapids | znver1 | znver2 | znver3 | znver4 | znver5
arch = "generic_v3"
# Extra -march/-mtune override appended to KCFLAGS
march = ""
# Default cpufreq governor | choices: schedutil | performance | powersave | ondemand | conservative
governor = "schedutil"
# AMD P-State operation mode | choices: active | guided | passive | disable | undefined
amd_pstate = "active"
# Energy Performance Preference hint applied at boot | choices: default | performance | balance_performance | balance_power | power
epp = "balance_performance"
# Speculative-execution mitigations | choices: on | off | nosmt
mitigations = "on"
# CONFIG_NR_CPUS (0 = host thread count rounded up to 8)
nr_cpus = 8
# Keep SMT/Hyper-Threading enabled
smt = true
# Machine Check Exception handling
mce = true
# AMD preferred-core / Intel ITMT priority (SCHED_MC_PRIO)
prefcore = true
# IA32_EMULATION (Steam, Wine, 32-bit binaries)
compat32 = false

[timing]
# Timer tick frequency | choices: 100 | 250 | 300 | 500 | 600 | 750 | 1000
hz = 250
# Tickless mode | choices: periodic | idle | full
tickless = "idle"
# Preemption model | choices: lazy | full | rt
preempt = "lazy"
# PREEMPT_DYNAMIC (preempt= boot switch)
preempt_dynamic = false

[memory]
# Memory footprint tier (bundles many small Kconfig cuts) | choices: standard | lean | minimal | embedded
footprint = "embedded"
# Transparent Hugepages mode | choices: always | madvise | never
thp = "never"
# THP defrag strategy | choices: always | defer | defer+madvise | madvise | never
thp_defrag = "defer+madvise"
# THP for shmem/tmpfs | choices: always | within_size | advise | never
thp_shmem = "never"
# Multi-Gen LRU
mglru = true
# lru_gen/enabled bitmask
mglru_mask = 7
# lru_gen/min_ttl_ms anti-thrash threshold
mglru_min_ttl_ms = 1000
# Compressed swap backend | choices: zram | zswap | none
swap_backend = "zram"
# Primary ZRAM compressor | choices: zstd | lz4 | lz4hc | lzo-rle
zram_algo = "zstd"
# ZRAM recompression algorithm for idle pages (multi-comp) | choices: zstd | lz4 | lz4hc | lzo-rle
zram_recomp_algo = "zstd"
# ZRAM size as percent of RAM
zram_size_pct = 150
# CONFIG_ZRAM_MULTI_COMP (multi-algorithm swap compression in kernel)
zram_multi_comp = false
# zswap compressor | choices: zstd | lz4 | lz4hc | lzo
zswap_compressor = "zstd"
# zswap.max_pool_percent
zswap_max_pool_pct = 25
# vm.swappiness (0 = auto: 180 zram, 100 zswap, 60 none)
swappiness = 180
# vm.vfs_cache_pressure (0 = auto by footprint)
vfs_cache_pressure = 200
# vm.watermark_scale_factor
watermark_scale_factor = 125
# vm.watermark_boost_factor (0 recommended with zram)
watermark_boost_factor = 0
# vm.compaction_proactiveness (0 = auto: 20 with THP, 0 without)
compaction_proactiveness = 0
# vm.dirty_bytes in MiB (0 = kernel ratio defaults)
dirty_bytes_mb = 32
# CONFIG_SLUB_TINY minimal allocator (sacrifices SMP scalability)
slub_tiny = true
# CONFIG_SLAB_BUCKETS hardening buckets (slightly more memory)
slab_buckets = false
# CONFIG_PER_VMA_LOCK
per_vma_lock = true
# NUMA topology support
numa = false
# Automatic NUMA balancing
numa_balancing = false
# CONFIG_NODES_SHIFT
nodes_shift = 2
# Kernel Samepage Merging support
ksm = false
# Activate ksmd at boot (only merges MADV_MERGEABLE/prctl opted-in memory)
ksm_run = false
# DAMON monitoring + DAMON_RECLAIM proactive reclaim
damon = true
# Free page reporting to the hypervisor (VM guests)
page_reporting = false
# hugetlbfs / HugeTLB pages
hugetlbfs = false
# KALLSYMS_ALL (all symbols incl. data; ~1-2 MiB)
kallsyms_all = false
# cgroup v2 memory controller (systemd MemoryMax, oomd)
memcg = true
# BASE_SMALL: shrink core hash tables (embedded)
base_small = true
# CONFIG_LOG_BUF_SHIFT (0 = 17 standard / 16 lean / 15 minimal)
log_buf_shift = 15
# ftrace/kprobes/uprobes surface | choices: auto | full | minimal
tracing = "minimal"
# kexec + crash dump support
kexec = false
# Embed .config (/proc/config.gz)
ikconfig = false
# TRIM_UNUSED_KSYMS (breaks out-of-tree modules; only with headers=never)
trim_unused_ksyms = true
# LD_DEAD_CODE_DATA_ELIMINATION (inert on upstream x86-64)
dead_code_elimination = false

[compiler]
# Toolchain | choices: llvm | gcc
toolchain = "llvm"
# Optimization level | choices: o2 | o3 | size
optimize = "size"
# Link-time optimization | choices: none | thin | full
lto = "thin"
# Persist the ThinLTO cache across builds
thinlto_cache = true
# Prune the ThinLTO cache above this size
thinlto_cache_size_gb = 20
# Feedback-directed optimization | choices: none | autofdo | autofdo_propeller
fdo = "none"
# Directory holding kernel.afdo / propeller_* profiles
fdo_profile_dir = ""
# Clang kCFI (CONFIG_CFI) + FineIBT auto
kcfi = false
# Debug info level | choices: none | reduced | full
debug_info = "none"
# Module compression | choices: zstd | xz | gzip | none
module_compress = "zstd"
# Rust support (auto-disabled when LTO + BTF are both required)
rust = false
# Parallel jobs (0 = auto from CPU threads and RAM)
jobs = 0
# Headers package policy | choices: auto | always | never
headers = "never"
# MODVERSIONS symbol CRCs (needs GENDWARFKSYMS with Rust)
modversions = false

[security]
# Hardening bundle | choices: balanced | extreme | hardened
profile = "balanced"
# Zero memory on allocation
init_on_alloc = true
# Zero memory on free (expensive)
init_on_free = false
# Hardened usercopy bounds checks
hardened_usercopy = true
# Stack protector | choices: strong | regular | none
stackprotector = "strong"
# SLAB freelist pointer obfuscation
slab_freelist_hardened = true
# Randomized freelists
slab_freelist_random = true
# Randomize kernel stack offset per syscall
randomize_kstack = true
# UBSAN array-bounds instrumentation
ubsan_bounds = false
# Build AppArmor and place it in the default LSM order
apparmor = false
# Build SELinux (kept out of the default LSM order)
selinux = false
# SECURITY_LOCKDOWN_LSM_EARLY
lockdown_early = false
# Acknowledge extreme profile / mitigations=off risks
acknowledge_risk = false

[gaming]
# In-tree NTSync driver (CONFIG_NTSYNC=m)
ntsync = false
# UCLAMP_TASK utilization clamping
uclamp = false
# vm.max_map_count
max_map_count = 2147483642
# Split-lock detection penalty (off = better emulator/game frametimes)
split_lock_mitigate = false
# Keep controller/HID drivers (xpad, playstation, nintendo, steam, uinput)
controllers = false

[storage]
# nvme.poll_queues (IOPOLL) count
nvme_poll_queues = 0
# NVMe I/O scheduler udev default | choices: none | mq-deadline | bfq | kyber | keep
io_scheduler = "mq-deadline"
# Block writeback throttling
blk_wbt = true
# BLK_CGROUP_IOCOST proportional I/O control
iocost = false
# Additional filesystems to keep as modules (e.g. xfs, f2fs)
extra_filesystems = []

[power]
# Power-efficient unbound workqueues
wq_power_efficient = false
# cpuidle governor | choices: teo | menu | haltpoll
cpu_idle_governor = "teo"
# RCU lazy callbacks on all CPUs (battery)
rcu_lazy = false
# Energy model / EAS
energy_model = false
# Suspend-to-idle/RAM
suspend = true
# Hibernation (zstd compressed image)
hibernation = false
# Default PCIe ASPM policy | choices: default | powersave | powersupersave | performance
pcie_aspm = "default"
# SND_HDA_POWER_SAVE_DEFAULT seconds (0 = off)
hda_power_save = 0

[network]
# TCP congestion control | choices: bbr | cubic | reno
congestion = "cubic"
# Root queueing discipline | choices: fq | cake | fq_codel | fq_pie | pfifo_fast
qdisc = "fq_codel"
# Multipath TCP
mptcp = false
# AF_XDP sockets
xdp = false
# Legacy /proc/net/nf_conntrack
nf_conntrack_procfs = false
# net.ipv4.tcp_fastopen=3
tcp_fastopen = true

[modules]
# Pruning mode | choices: strict | expanded
mode = "strict"
# Use modprobed.db as LSMOD
modprobed_db = true
# Custom modprobed.db path (imported bundles)
modprobed_db_path = ""
# Strict mode may fall back to the live lsmod set
allow_lsmod_fallback = false
# Extra LMC_KEEP paths (expanded mode)
lmc_keep_extra = []
# Kconfig symbols forced to =m after pruning (e.g. WIREGUARD, TUN)
keep_symbols = []
# Build pruned modules into the image (localyesconfig)
localyesconfig = false
# MODULE_SIG_FORCE (auto-generated key)
sig_force = false

[boot]
# How flavor tuning reaches the kernel command line | choices: bake | entry | print
cmdline = "bake"
# Extra kernel parameters appended to the flavor tuning
cmdline_extra = ""
# Write/refresh systemd-boot entries for this flavor
write_entries = true
# Disable NMI/soft watchdog (nowatchdog nmi_watchdog=0)
nowatchdog = false
[verify]
# Hard-fail when a non-optional Kconfig contract entry is unmet
strict = true
# Extra symbols treated as soft in the contract
optional_symbols = []
# Require NTSync when gaming.ntsync=true
require_ntsync = false
# Require BTF whenever sched_ext is compiled
require_btf = false
# Require SCHED_CLASS_EXT when scx daemon != none
require_sched_ext = true
