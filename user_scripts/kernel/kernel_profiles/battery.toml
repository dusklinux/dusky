# Dusky Kernel Compiler v6.1.0 — General Mobile Battery Profile
# Target: Modern Laptops (AMD Ryzen 6000-8000/AI 300, Intel 12th-14th Gen / Core Ultra)
# Philosophy: Maximize package C-state residency, batch wakeups, minimize timer ticks.

[meta]
name = "battery"
description = "maximum battery savings"
suffix = "dusky-battery"
priority = 60
tags = ["laptop", "battery", "mobile", "efficiency"]
bare_metal_only = false         # Keep VFIO/IOMMU for GPU passthrough; fine for a physical laptop
portable_package = false        # Allows native CPU instruction optimization on this PC


# ==============================================================================
# [release] — Upstream Branch & Integrity
# ==============================================================================
[release]
channel = "stable"              # Track stable 7.2.y releases for daily reliability
pin = ""
allow_rc =  true               # Laptops need reliability; avoid pre-release RCs
min_version = "7.2"
require_signature = true        # Verify PGP signatures with kernel.org release keys


# ==============================================================================
# [scheduler] — CPU Scheduling & Dynamic Schedulers
# ==============================================================================
[scheduler]
type = "eevdf"                  # Upstream fair scheduler (most predictable power behavior)
scx = "none"                    # Disabled: scx 1.1.3 crashes on 7.2.4 and wakes dGPU every 2s
scx_flags = ""                  # No daemon until scx updates past 1.1.3
scx_enable_class = true         # Compiles in-tree sched_ext support (CONFIG_SCHED_CLASS_EXT)
require_patch = false
allow_vanilla_fallback = true
autogroup = true                # Per-session desktop task isolation
rt_group = false                # Prevents starvation of PipeWire/audio RT threads
sched_core = false              # Disable SMT core scheduling overhead on trusted personal laptops
patch_sources = ["cachyos", "upstream_author", "tkg"]


# ==============================================================================
# [cache] — Cache-Aware Scheduling (CAS)
# ==============================================================================
[cache]
sched_cache = true              # Preserves core-to-L3 affinity
llc_aggr_tolerance = 1          # Conservative aggregation threshold
llc_aggr_cap = -1


# ==============================================================================
# [rseq] — Restartable Sequences
# ==============================================================================
[rseq]
slice_extension = true          # Avoids convoy stalls when preempted in critical sections
slice_ext_nsec = 10000          # 10us quantum extension


# ==============================================================================
# [dusky] — Enhancement Patches & Kconfig Overrides
# ==============================================================================
[dusky]
enhanced = true                 # Desktop optimizations & faster framebuffer takeover
patch_sched_inline = true       # Inlines context switch functions (cuts cycle overhead)
patch_evdev_rcu = true          # Asynchronous evdev detach (eliminates device close delays)
patch_pci_pme = true            # Clear Linux 4000ms PCI PME polling (reduces idle wakeups)
hostname = ""
user = ""
reproducible = true
seed = "auto"
extra_config = { VFIO_DEVICE_CDEV = true, VFIO_GROUP = true, VFIO_CONTAINER = true, VFIO_VIRQFD = true, VFIO_PCI_INTX = true, VFIO_PCI_VGA = true, VFIO_PCI_IGD = true, VFIO_PCI_DMABUF = true, IOMMUFD_DRIVER = true, IOMMUFD_DRIVER_CORE = true, VIRTIO_MENU = true, VIRTIO_PCI = "m", VIRTIO_BLK = true, VIRTIO_NET = "m", DRM_VIRTIO_GPU = "m", DRM_BOCHS = "m" }


# ==============================================================================
# [cpu] — P-States, Governors & Mitigations
# ==============================================================================
[cpu]
arch = "native"                 # Optimize specifically for your laptop's CPU pipeline
march = ""
amd_pstate = "undefined"        # You have Intel silicon, not AMD
governor = "powersave"          # Standard driver for Intel HWP
epp = "power"                   # Energy-Performance Preference
mitigations = "off"             # disabled all security stuff for at home stuff, no shared network
nr_cpus = 0                     # Automatically size per-CPU structures (0 = auto, minimum floor of 64)
smt = true                      # Keep Hyper-Threading/SMT active
mce = true                      # Machine Check Exception reporting
prefcore = true                 # AMD Preferred Core / Intel ITMT core ranking
compat32 = true                 # Keep 32-bit IA32 emulation active for Steam/Wine


# ==============================================================================
# [timing] — Clock Cadence & Preemption
# ==============================================================================
[timing]
# 300 Hz provides clean harmonics with 30/60/120 Hz screen refreshes and cuts
# timer interrupts by 70% compared to 1000 Hz, while bounding lazy preemption to <= 3.3ms.
hz = 300
tickless = "idle"               # NO_HZ_IDLE: stops the scheduler tick on idle cores
preempt = "lazy"                # PREEMPT_LAZY: high responsiveness with low switch frequency
preempt_dynamic = true          # Permits dynamic testing via preempt= boot parameter


# ==============================================================================
# [memory] — Tailored for Intel i7-12700H + 64 GB DDR5 + ZRAM-Only (Lowest Power)
# ==============================================================================
[memory]
footprint = "lean"              # Strips background tracing bloat
thp = "never"                   # Shuts down khugepaged background scanning completely
thp_defrag = "never"            # Disables memory compaction wakeups
thp_shmem = "never"             # Prevents memory bloat in /dev/shm
mglru = true                    # Modern low-CPU generational page management
mglru_mask = 7                  # Full hardware MMU page-table walking
mglru_min_ttl_ms = 0            # Disables unnecessary thrash-detection timers
swap_backend = "zram"           # Keeps swap in RAM; NVMe SSD stays asleep at ~3 mW
zram_algo = "zstd"              # Best compression value
zram_recomp_algo = "lz4"        # Matches primary
zram_size_pct = 50              # 25% = 16 GB compressed emergency pool (ample for 64 GB)
zram_multi_comp = false         # Eliminates background recompression timer wakeups
zswap_compressor = "zstd"       # Dormant (zswap disabled)
zswap_max_pool_pct = 25         # Dormant (zswap disabled)
swappiness = 50                 # Keeps programs in raw RAM; stops CPU from compressing idle data
vfs_cache_pressure = 50         # Keeps file metadata in RAM; keeps NVMe SSD asleep
watermark_scale_factor = 10     # Standard 64 MB buffer; keeps kswapd asleep
watermark_boost_factor = 0      # Disables panic-mode aggressive memory eviction
compaction_proactiveness = 0    # Stops kcompactd from proactively waking CPU cores
dirty_bytes_mb = 480            # Replaces 12 GB writeback storms with tiny 128 MB bursts
slub_tiny = false               # Essential for 20 threads: prevents cores fighting over 1 lock
slab_buckets = false            # Leanest slab cache footprint
per_vma_lock = true             # Fast parallel memory mapping; lets cores return to sleep sooner
numa = false                    # Strips multi-node allocator loops; lean single-socket operation
numa_balancing = false          # Eliminates recurring page-table scans and fake faults
nodes_shift = 0                 # Sized exactly for 1 node
ksm = false                     # Eliminates background memory scanning across 64 GB RAM
ksm_run = false                 # Ensures ksmd is never started
damon = false                   # Prevents background scanning threads from waking CPU cores
page_reporting = false          # Excludes VM-only hypervisor ballooning code
hugetlbfs = false               # Strips unused static database hugepages
kallsyms_all = false            # Keeps function names in logs while saving ~1 MB of variable tables
memcg = true                    # Mandatory for systemd on Arch Linux
base_small = false              # Full-sized hash tables prevent CPU search collisions
log_buf_shift = 16              # Clean 64 KB log buffer
tracing = "auto"                # Enables hooks only if scx_lavd needs them
kexec = false                   # Strips unneeded instant-reboot server code
ikconfig = true                 # 30 KB configuration tracker for easy auditing (0 Watts)
trim_unused_ksyms = false       # Mandatory: prevents breaking outside drivers and DKMS
dead_code_elimination = false   # Unsupported on x86-64 (ThinLTO handles this already)


# ==============================================================================
# [compiler] — LLVM Toolchain, ThinLTO & Caching
# ==============================================================================
[compiler]
toolchain = "llvm"              # Clang/LLD
optimize = "o2"                 # Standard performance optimization
polly = false
lto = "thin"                    # ThinLTO gives cross-module optimization without huge link memory
thinlto_cache = true            # Persistent bitcode cache for fast rebuilds
thinlto_cache_size_gb = 20
fdo = "none"
fdo_profile_dir = ""
kcfi = false                    # Keep false to avoid conflicts with out-of-tree modules
debug_info = "reduced"          # DWARF5 without struct info (promoted to full if BTF is required)
module_compress = "zstd"        # Fast decompression at modprobe time
rust = false                    # Required: BTF (sched_ext) + LTO excludes in-kernel Rust
jobs = 0                        # Auto-detect parallel jobs from cores and RAM
headers = "auto"                # Builds linux-headers only if DKMS modules are installed
modversions = false


# ==============================================================================
# [security] — Hardening Profile
# ==============================================================================
[security]
profile = "balanced"            # Standard Arch Linux security posture
init_on_alloc = true            # Zero memory on allocation (infoleak prevention)
init_on_free = false            # Zero on free costs 3-10% CPU; keep false on battery
hardened_usercopy = true
stackprotector = "none"
slab_freelist_hardened = true
slab_freelist_random = true
randomize_kstack = true
ubsan_bounds = true
apparmor = false
selinux = false
lockdown_early = false
acknowledge_risk = true


# ==============================================================================
# [gaming] — Gaming Interoperability
# ==============================================================================
[gaming]
ntsync = true                   # Keep NTSync compiled (doesn't hurt battery when unused)
uclamp = false                  # Inert under autonomous P-States; avoid bookkeeping
max_map_count = 1048576         # Safe default for Wine/Proton games
split_lock_mitigate = true      # Keep protection against misbehaving split-lock code
controllers = false              # Retain gamepads/input drivers in case you plug one in


# ==============================================================================
# [storage] — Block Layer & Filesystems
# ==============================================================================
[storage]
nvme_poll_queues = 0            # NVMe polling wastes continuous CPU; keep off on battery
io_scheduler = "none"           # Hardware NVMe queues handle scheduling
blk_wbt = true                  # Writeback throttling prevents desktop freezes
iocost = false
extra_filesystems = ["btrfs", "ext4", "vfat", "exfat", "ntfs"]


# ==============================================================================
# [power] — Idle Governors, RCU & PCIe Power
# ==============================================================================
[power]
wq_power_efficient = true       # Routes workqueues to already-awake cores
cpu_idle_governor = "teo"       # Timer Events Oriented idle governor (best for tickless)
rcu_lazy = true                 # Batches non-urgent RCU callbacks for up to 10s
energy_model = false            # Inert on symmetric x86
suspend = true                  # System suspend-to-RAM / s2idle
hibernation = true              # if you ever want to enable hiberatinon using disk swap, you have the option to. 
pcie_aspm = "powersupersave"         # Aggressive PCIe ASPM (L1 substates); safe baseline
hda_power_save = 5              # Power down HD audio codec after 5 seconds of silence


# ==============================================================================
# [network] — Congestion Control & Pacing
# ==============================================================================
[network]
congestion = "bbr"              # Model-based TCP; handles lossy Wi-Fi connections best
qdisc = "fq"              # Standard queue discipline for general client links
mptcp = true
xdp = false
nf_conntrack_procfs = false
tcp_fastopen = true             # Saves an RTT on repeat HTTP/TLS connections


# ==============================================================================
# [modules] — Hardware Pruning & Module Census
# ==============================================================================
[modules]
mode = "strict"                 # Build only drivers captured in modprobed.db
modprobed_db = true             # Read ~/.config/modprobed.db
modprobed_db_path = ""
allow_lsmod_fallback = false
lmc_keep_extra = ["drivers/input", "drivers/hid", "sound/pci", "drivers/vfio", "drivers/i2c/busses"]
keep_symbols = [
  # Laptop Battery, Power & USB-C Docking
  "ACPI_BATTERY", "ACPI_AC", "TYPEC", "TYPEC_UCSI", "UCSI_ACPI", "THUNDERBOLT", "USB4",
  # Touchpad & Inputs
  "HID_MULTITOUCH", "I2C_HID_ACPI",
  # Intel Wi-Fi & Bluetooth
  "IWLWIFI", "IWLMVM", "BT_HCIBTUSB", "BT_INTEL",
  # ASUS Laptop Hotkeys, Backlight & Fan Control
  "ASUS_WMI", "ASUS_NB_WMI",
  # VPN Support
  "WIREGUARD", "TUN",
  # Nouveau future switch (i2c helper, unused with proprietary but kept for later)
  "I2C_NVIDIA_GPU",
  # VFIO GPU passthrough (tristate only here, bools live in dusky.extra_config)
  "VFIO", "VFIO_PCI", "VFIO_PCI_CORE", "VFIO_IOMMU_TYPE1", "IOMMUFD",
  # KVM / QEMU VirtIO guest drivers (modular, 0-byte cost on bare metal)
  "VIRTIO_PCI", "VIRTIO_NET", "DRM_VIRTIO_GPU", "DRM_BOCHS"
]
localyesconfig = false
sig_force = false


# ==============================================================================
# [boot] — Command Line Delivery & Bootloader
# ==============================================================================
[boot]
cmdline = "bake"                # Bake flavor parameters into CONFIG_CMDLINE
cmdline_extra = "pcie_aspm=force"              # Force ASPM despite FADT claiming unsupported (ASUS TUF needs this)
write_entries = true            # Automatically write systemd-boot entries
nowatchdog = true               # Removes NMI/soft watchdog timer ticks (saves CPU wakeups)
acs_override = false


# ==============================================================================
# [verify] — Invariant Contract Enforcement
# ==============================================================================
[verify]
strict = true                   # Fail build (exit 4) if any required symbol is dropped
optional_symbols = []
require_ntsync = true
require_btf = true              # Asserts BTF presence for sched_ext
require_sched_ext = true        # Asserts CONFIG_SCHED_CLASS_EXT presence
