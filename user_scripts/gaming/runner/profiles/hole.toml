# ==============================================================================
# HOLE Profile
# ==============================================================================
# Engine: Unreal Engine 4/5 (Windows) via ColdClientLoader.
# Exe target: HOLE/Binaries/Win64/HOLE-Win64-Shipping.exe

extends = "base_unreal_engine_5"

[meta]
id = "hole"
name = "HOLE"
version = "1.0"
icon = "applications-games"
developer = "Unknown"
genre = "Horror / Adventure / Unreal"
description = "Unreal Engine psychological horror - descend through a mysterious hole into shifting, unsettling environments."

[paths]
game_dir = "/mnt/media/games/unknown_quality/HOLE-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "HOLE/Binaries/Win64/HOLE-Win64-Shipping.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true

[runtime.wine.dll_overrides]
"winemenubuilder.exe" = "d"
mshtml = "d"
dxgi = "n,b"
d3d11 = "n,b"
d3d12 = "n,b"
d3d9 = "n,b"

[graphics]
gpu = "discrete"
wayland_native = true

[graphics.gamescope]
enabled = false

[performance]
gamemode = true
mangohud = false
fps_limit = 60
