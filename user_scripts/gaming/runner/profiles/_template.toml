# ==============================================================================
# Master Game Runner Engine (MGRE) -- Definitive Profile Reference Template
# Target: Bleeding-Edge Arch Linux (Kernel 7.1+, Python 3.14+, Pure Wayland)
# ==============================================================================
# This reference template documents all 15 configuration tables, preset inheritance,
# variable interpolation, hardware-conditional overrides, and runtime controls.
#
# QUICK START:
#   1. Copy template: cp profiles/_template.toml profiles/<game_id>.toml
#   2. Choose base preset archetype:
#        - "base_native"          -> Native Linux binaries (ELF / Shell)
#        - "base_unity_native"    -> Native Linux Unity Engine titles (2021+)
#        - "base_wine_dxvk"       -> Windows games via Wine-Staging + DXVK (D3D9-11)
#        - "base_unreal_engine_5" -> Windows games with UE5 / D3D12 / VKD3D
#   3. Fill paths: 'paths.game_dir' and 'paths.executable'
#   4. Test / Validate / Launch:
#        python3 master_runner.py validate <game_id>
#        python3 master_runner.py run <game_id> --dry-run
#        python3 master_runner.py run <game_id>
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Preset Inheritance (extends)
# ------------------------------------------------------------------------------
# Inherits archetype defaults from presets/*.toml or built-in presets.
# Can be a single string or an ordered array of presets, e.g.:
#   extends = "base_native"
#   extends = ["base_wine_dxvk", "my_custom_preset"]
# Any key defined in this profile overrides preset values.
extends = "base_native"

# ------------------------------------------------------------------------------
# 2. Metadata Information [meta]
# ------------------------------------------------------------------------------
[meta]
id          = "example_game"                    # Unique profile ID (must match <id>.toml filename)
name        = "Example Game Title"            # Display title for TUI, logs, notifications, .desktop
version     = "1.0.0"                          # Build / patch version
icon        = "applications-games"            # System icon name or absolute image path (.png/.ico/.svg)
developer   = "Example Studio"                # Developer or publisher name
genre       = "Action / Adventure"             # Game genre classification
description = "A concise description of the game profile and notes."

# ------------------------------------------------------------------------------
# 3. Paths & Storage Lifecycle [paths]
# ------------------------------------------------------------------------------
# Variable expansions supported in all path and string fields:
#   $GAME_DIR         -> Resolved paths.game_dir
#   $GAME_ID          -> Profile ID (e.g. "example_game")
#   $PROFILE_ID       -> Profile ID alias (identical to $GAME_ID)
#   $ROOT             -> Runner engine root directory (/home/dusk/user_scripts/gaming/runner)
#   $HOME or ~        -> User home directory (/home/<user>)
#   $USER             -> Current username
#   $ZRAM             -> Resolves to /mnt/zram1 (volatile RAM disk)
#   $XDG_DATA_HOME    -> ~/.local/share
#   $XDG_CONFIG_HOME  -> ~/.config
#   $XDG_CACHE_HOME   -> ~/.cache
#   $XDG_STATE_HOME   -> ~/.local/state
#   $XDG_RUNTIME_DIR  -> /run/user/<uid>
#   $STATE_DIR        -> Engine state directory (~/.local/state/master-game-runner)
#   $CACHE_DIR        -> Engine cache directory (~/.cache/master-game-runner)
[paths]
game_dir = "/mnt/zram1/ExampleGame"            # Base game root directory or container

# DwarFS FUSE Read-Only Compressed Image + fuse-overlayfs Union Layer:
# (Omit or leave empty if game is already uncompressed on disk)
dwarfs_image    = "files/game-root.dwarfs"     # Compressed data image (relative to game_dir or absolute)
dwarfs_mount    = "files/.game-root-mnt"       # Read-only DwarFS mountpoint
overlay_dir     = "files/game-root"            # Playable union directory (merged lower + upper)
overlay_storage = "files/overlay-storage"      # Persistent write layer (saves, mods, logs)
overlay_work    = "files/.game-root-work"      # Scratch workdir for OverlayFS (auto-cleaned)

# Executable Specification:
# Relative to overlay_dir (if DwarFS active) or relative to game_dir (if uncompressed).
# NOTE: Always point directly to the main game binary (e.g. "Game.exe" or
# "Binaries/Win64/Game-Win64-Shipping.exe"). Avoid transient launcher wrappers
# (such as "steamclient_loader_x64.exe") which exit immediately and cause session teardown.
executable  = "bin/example_binary"
working_dir = ""                               # Execution CWD (empty = executable parent directory)

# CLI Arguments & Renderer Flags:
# Forwarded directly to the binary. Use this for engine-specific rendering backends:
#   - BeamNG.drive / Torque3D:  ["-gfx", "vk"]       (Native Vulkan — eliminates D3D12/VKD3D flickering on Intel iGPU)
#   - Unreal Engine 4/5:        ["-dx11"] or ["-dx12"] or ["-vulkan"]
#   - Unity / Source / Godot:   ["-force-vulkan"] or ["-force-d3d11"] or ["-novid", "-fullscreen"]
# TIP: On Intel Integrated Graphics (Iris Xe / ANV Mesa), prefer native Vulkan ("-gfx vk", "-vulkan")
#      or DXVK Direct3D 11 ("-dx11") over D3D12/VKD3D to prevent descriptor indexing / swapchain flickering.
arguments   = []

# ------------------------------------------------------------------------------
# 4. Runtime Selection [runtime]
# ------------------------------------------------------------------------------
[runtime]
# "native" -> Linux ELF binary
# "wine"   -> Windows executable via Wine-Staging
# "proton" -> Steam Proton container (uses STEAM_COMPAT_DATA_PATH)
# "umu"    -> Unified launcher (umu-run)
# "script" -> Shell script launcher
type = "native"

# ------------------------------------------------------------------------------
# 5. Wine Execution Layer [runtime.wine]
# (Active when runtime.type is "wine")
# ------------------------------------------------------------------------------
[runtime.wine]
wine_binary           = "wine"                 # "wine", "wine64", or custom binary path
prefix_dir            = "files/wine-prefix"    # WINEPREFIX directory (relative or absolute)
arch                  = "win64"                # "win64" (64-bit) or "win32" (32-bit legacy)
sync_mode             = "auto"                 # "auto" (ntsync when kernel >=7.1 -> fsync -> esync -> server)
debug                 = "fixme-all"            # WINEDEBUG channel filter ("-all", "fixme-all", "warn+all")
large_address_aware   = true                   # WINE_LARGE_ADDRESS_AWARE=1 (prevents 2GB 32-bit OOM)
dxvk                  = true                   # Direct3D 9/10/11 -> Vulkan translation (auto-links runtime)
vkd3d                 = true                   # Direct3D 12 -> Vulkan translation (auto-links runtime)
vkd3d_config          = ""                     # VKD3D-Proton flags ("force_static_cbv", "upload_hvv", "no_upload_hvv")
dxvk_nvapi            = false                  # DXVK-NVAPI for DLSS 2/3 Super Resolution & Frame Gen
disable_menubuilder   = true                   # Suppress winemenubuilder .desktop pollution
hide_wine             = false                  # WINE_HIDE_VERSION / PROTON_HIDE_NVIDIA_GPU
reprovision           = false                  # Force re-linking DXVK/VKD3D/NVAPI DLLs and redistributables on launch

# DLL Overrides:
# Best practice: use "n,b" (native first, built-in fallback) for translation DLLs.
# "n" -> Native only; "b" -> Builtin only; "n,b" -> Native first, builtin fallback; "d" -> Disabled.
dll_overrides = { "winemenubuilder.exe" = "d", "mshtml" = "d", "dxgi" = "n,b", "d3d11" = "n,b", "d3d12" = "n,b", "d3d9" = "n,b" }

# Automated Prefix Provisioning:
# (Runner automatically discovers & links DXVK 2.6.2, VKD3D 2.14, DXVK-NVAPI, and DLSS into prefix)
redistributables = []                          # e.g. ["VC_redist.x64.exe", "directx/DXSETUP.exe"]
winetricks       = []                          # e.g. ["vcrun2022", "d3dcompiler_47"]

# ------------------------------------------------------------------------------
# 5b. UMU / Proton Configuration [runtime.umu]
# (Active when runtime.type is "proton" or "umu")
# ------------------------------------------------------------------------------
[runtime.umu]
game_id     = ""                               # Game ID or AppID (empty = umu-$GAME_ID)
store       = "none"                           # Store identifier: "none", "steam", "epic", "gog", "heroic"
proton      = "GE-Proton11-6"                  # Proton directory or version name
verb        = "waitforexitandrun"              # Proton verb to invoke
protonfixes = true                             # Enable community protonfixes database

# ------------------------------------------------------------------------------
# 6. Graphics Pipeline & Wayland Integration [graphics]
# ------------------------------------------------------------------------------
[graphics]
# GPU Selection:
#   - Semantic:  "auto", "discrete", "integrated", "primary"
#   - Vendor:    "nvidia", "amd", "intel"
#   - Explicit:  "10de:25a0", "card0", "card1", "0000:01:00.0", "pci-0000_01_00_0", "0", "1"
# ARCHITECTURE NOTE ON VRAM VS SHARED RAM:
#   - "discrete":   Uses NVIDIA dGPU (e.g. RTX 3050 Ti Laptop). Fast compute, but hard-capped by dedicated
#                   VRAM (e.g. 4GB). Heavy textures/simulation maps exceeding 4GB can cause VRAM exhaustion.
#   - "integrated": Uses Intel Iris Xe / AMD Radeon iGPU. Dynamically allocates from system RAM (e.g. up to
#                   32GB shared memory on a 64GB host). Ideal for memory-heavy games.
#                   Pair with native Vulkan ("-gfx vk") or DXVK ("-dx11") to prevent D3D12 Intel ANV flickering.
gpu = "auto"

wayland_native       = true                    # Enable Wine-Staging native Wayland driver (waylanddrv)
prefer_xwayland      = false                   # Force DISPLAY=:0 for archaic engines lacking Wayland
vulkan_icd           = "auto"                  # Vulkan driver manifest: "auto", "nvidia", "radv", "intel"
radv_perftest        = ""                      # RADV Vulkan debug/tuning flags (e.g. "sam,rt,aco")
raytracing           = false                   # Enable DXR ray tracing (auto-sets VKD3D_CONFIG=dxr,dxr11)
gl_threaded          = true                    # Multithreaded OpenGL (MESA_GL_THREAD / __GL_THREADED_OPTIMIZATIONS)
vsync                = "default"               # "default", "on", "off"
hdr                  = false                   # Enable HDR surface presentation (ENABLE_HDR_WSI=1)
shader_cache         = true                    # Per-game isolated shader cache
shader_cache_size_gb = 12                     # Maximum shader cache allocation in GiB

# Gamescope Micro-Compositor Sandbox
[graphics.gamescope]
enabled           = false                      # Enable Gamescope nested Wayland micro-compositor
backend           = "wayland"                  # "wayland" (under Hyprland), "drm" (TTY), "sdl", "headless"
mode              = "borderless"               # "borderless", "fullscreen", "windowed"
width             = 0                          # Internal render resolution width (-w, 0 = native display)
height            = 0                          # Internal render resolution height (-h, 0 = native display)
output_width      = 0                          # Monitor output width (-W, 0 = native display)
output_height     = 0                          # Monitor output height (-H, 0 = native display)
refresh_rate      = 0                          # Refresh rate cap (-r, 0 = native display Hz)
unfocused_refresh = 0                          # Refresh rate cap when window loses focus (-o, 0 = uncapped)
scaler            = ""                         # "auto", "integer", "fit", "fill", "stretch"
filter            = ""                         # "linear", "nearest", "fsr", "nis", "pixel"
fsr_sharpness     = 5                          # FSR sharpness: 0 (sharpest) .. 20 (softest)
adaptive_sync     = false                      # VRR / Adaptive Sync (--adaptive-sync)
immediate_flips   = false                      # Low-latency tearing (--immediate-flips, DRM backend only)
force_grab_cursor = false                      # Force cursor capture/confinement (--force-grab-cursor)
grab_keyboard     = false                      # Force exclusive keyboard capture (-g)
realtime          = true                       # Real-time process priority (--rt)
hdr               = false                      # Enable Gamescope HDR wide-gamut presentation
hdr_itm           = false                      # Enable Gamescope SDR-to-HDR Inverse Tone Mapping (--hdr-itm-enable)
expose_wayland    = true                       # Expose wayland socket to native clients (--expose-wayland)
xwayland_count    = 0                          # Spawn multiple nested Xwayland instances (--xwayland-count)
mangoapp          = true                       # Use --mangoapp inside Gamescope (avoids double HUD)
extra_args        = []                         # Custom CLI flags for Gamescope

# ------------------------------------------------------------------------------
# 7. Performance & Scheduling [performance]
# ------------------------------------------------------------------------------
[performance]
gamemode          = true                       # Enable Feral GameMode daemon (gamemoderun)
mangohud          = false                      # Inject MangoHud telemetry overlay (MANGOHUD=1)
mangohud_preset   = ""                         # Custom preset ("minimal", "full")
fps_limit         = 0                          # Absolute framerate cap (0 = uncapped)
cpu_affinity      = ""                         # CPU binding: "0-7", "pcores", "smt-off", or ""
scope_cpu_weight  = 0                          # systemd cgroup CPU weight (0 = default 100)
scope_io_weight   = 0                          # systemd cgroup I/O weight (0 = default 100)
scope_memory_high = ""                         # Memory throttle threshold, e.g. "24G"

# ------------------------------------------------------------------------------
# 8. Audio Server [audio]
# ------------------------------------------------------------------------------
[audio]
driver        = "pipewire"                     # "pipewire", "pulseaudio", "alsa"
quantum       = 1024                           # Buffer size in frames (1024/48000 = 21.3 ms latency)
rate          = 48000                          # Audio sample rate in Hz
openal_driver = ""                             # auto; set only when supported by the game

# ------------------------------------------------------------------------------
# 9. Gamepad & Input Mapping [input]
# ------------------------------------------------------------------------------
[input]
sdl_gamecontrollerconfig = ""                  # Custom mapping string or path to gamecontrollerdb.txt
raw_input                = true                # Enable direct evdev / raw input handling

# ------------------------------------------------------------------------------
# 10. Storage & DwarFS Tuning [storage]
# ------------------------------------------------------------------------------
[storage]
dwarfs_cache_percent    = 25                   # Cache allocation as % of MemAvailable (64MiB - 8GiB)
dwarfs_workers          = 0                    # Decompression threads (0 = auto: min(8, cpus/2))
dwarfs_tidy_strategy    = "time"               # Cache cleanup strategy ("time", "swap", "none")
dwarfs_tidy_interval    = "5m"                 # Cache sweep interval
dwarfs_tidy_max_age     = "10m"                # Block expiration age
dwarfs_seq_detector     = 4                    # Sequential read detector stream count
dwarfs_readahead        = "0"                  # Readahead size (e.g. "64k")
dwarfs_block_allocator  = "mmap"               # "mmap" or "malloc"
dwarfs_preload_category = ""                   # e.g. "hotness" for mkdwarfs --categorize=hotness
dwarfs_preload_all      = false                # Preload entire image into cache
auto_clean_workdir      = true                 # Purge stale .game-root-work on mount
union_backend           = "fuse-overlayfs"     # Rootless union filesystem driver

# ------------------------------------------------------------------------------
# 11. Runner Lifecycle & Session Safety [runner]
# ------------------------------------------------------------------------------
[runner]
auto_mount           = true                    # Mount DwarFS / OverlayFS automatically before run
auto_unmount_on_exit = true                    # Unmount upon game termination (guarded by MountLease)
mount_timeout_s      = 20.0                    # Maximum FUSE readiness wait budget
use_systemd_scope    = true                    # Confinement inside transient cgroup v2 scope
scope_slice          = "app-games.slice"       # systemd user slice
inhibit_idle         = true                    # Inhibit desktop screen saver and power blanking
inhibit_sleep        = true                    # Inhibit system sleep and lid suspend during play
notifications        = true                    # Send desktop notifications via notify-send
kill_grace_s         = 8.0                     # SIGTERM -> cgroup.kill atomic escalation timeout
enable_io_shim       = true                    # Preload runner_shim.so for DwarFS / Mono / FNA runtime quirks
shim_readonly_assets = false                   # Explicitly allow read-only demotion of static asset opens

# ------------------------------------------------------------------------------
# 12. Sandboxing & Bubblewrap Isolation [sandbox]
# ------------------------------------------------------------------------------
[sandbox]
enabled      = false                           # Run process inside Bubblewrap (bwrap) sandbox
sandbox_home = ""                              # Custom isolated $HOME (empty = ~/.local/share/game-sandboxes/<game_id>)
isolate_home = true                            # Restrict $HOME access to dedicated directory
bind_gpu     = true                            # Passthrough DRM / Vulkan / NVIDIA device nodes
bind_audio   = true                            # Passthrough PipeWire / PulseAudio sockets
bind_wayland = true                            # Passthrough Wayland compositor socket
bind_network = false                           # Block network / internet sockets

# ------------------------------------------------------------------------------
# 13. Declarative Config Patches [[config_patches]]
# ------------------------------------------------------------------------------
# Declaratively patch JSON, INI, or CFG game settings files before launch.
# Automatically resolves relative paths against:
#   - Windows user AppData (e.g. "AppData/Local/Game/settings.json")
#   - Wine C: drive (e.g. "drive_c/users/dusk/Saved Games/Game/config.ini")
#   - Game root directory (e.g. "settings.cfg")
# Supports dynamic template tokens:
#   {width}              -> Display resolution width (e.g. "1920")
#   {height}             -> Display resolution height (e.g. "1080")
#   {refresh}            -> Display refresh rate in Hz (e.g. "144")
#   {display_mode}       -> "Borderless" (under gamescope) or "Window" (pure Wayland)
#   {display_mode_lower} -> "borderless" or "window"
#   {gpu_name}           -> Active GPU model (e.g. "NVIDIA GeForce RTX 3050 Ti Laptop GPU")
#   {game_dir}           -> Game base directory
#   {root_dir}           -> Playable root directory (overlay union or game root)
#   {prefix_dir}         -> WINEPREFIX path
#   {user}               -> Current host username
#
# Example:
# [[config_patches]]
# file = "AppData/Local/GameName/settings.json"
# format = "json"                              # "json" | "ini" | "cfg"
# delete = ["AppData/Local/GameName/crash.ini"] # Stale crash/lock files to clean up
# [config_patches.set]
# DisplayMode = "{display_mode}"               # Windowed on Wayland avoids Torque3D/Unreal modal hangs
# Resolution = "{width}x{height}"
# RefreshRate = "{refresh}"
# SelectedGPU = "{gpu_name}"

# ------------------------------------------------------------------------------
# 14. Lifecycle Hooks [hooks]
# ------------------------------------------------------------------------------
[hooks]
pre_mount    = []                              # Commands before mounting FUSE layers
post_mount   = []                              # Commands after FUSE layers are mounted
pre_launch   = []                              # Commands right before process launch (e.g. build shims)
post_launch  = []                              # Commands immediately after process exits
post_unmount = []                              # Commands after unmounting FUSE layers

# ------------------------------------------------------------------------------
# 15. Custom Environment Variables [env]
# ------------------------------------------------------------------------------
[env]
# Key-value environment variables injected into the game process pipeline.
# Examples:
# MESA_GL_VERSION_OVERRIDE = "4.6"
# SDL_DYNAMIC_API = "/usr/lib/libSDL2-2.0.so"
# VKD3D_CONFIG = "force_static_cbv"

# ------------------------------------------------------------------------------
# 16. Hardware & Session Conditional Overlays [when.<predicate>]
# (Applied automatically when the active system satisfies the predicate)
# Composited in declaration order; any predicate can be negated with "not_" prefix.
# Available predicates:
#   - nvidia        -> NVIDIA GPU present in hardware topology
#   - amd           -> AMD GPU present in hardware topology
#   - intel         -> Intel GPU present in hardware topology
#   - hybrid        -> System has multiple non-software GPUs (e.g. Intel Xe + NVIDIA RTX)
#   - single_gpu    -> System has exactly one GPU
#   - ntsync        -> /dev/ntsync kernel fast synchronization driver is usable
#   - hdr_output    -> Focused display output supports HDR presentation
#   - hyprland      -> Running inside Hyprland Wayland compositor
#   - kwin          -> Running inside KDE Plasma / KWin
#   - wayland       -> Running inside any Wayland session (WAYLAND_DISPLAY set)
#   - kernel_ge_7_1 -> Linux kernel release is 7.1 or higher
#   - gamescope     -> gamescope compositor binary is installed on system
#
# Negation Examples:
#   [when.not_nvidia]   -> Applied on non-NVIDIA systems
#   [when.not_hybrid]   -> Applied on single-GPU desktops
#   [when.not_wayland]  -> Applied under X11 sessions
# ------------------------------------------------------------------------------
# [when.nvidia]
# runtime.wine.dxvk_nvapi = true
#
# [when.hybrid]
# graphics.gpu = "discrete"
#
# [when.not_hdr_output]
# graphics.hdr = false
