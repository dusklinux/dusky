# ==============================================================================
# Factorio Profile
# ==============================================================================

extends = "base_native"

[meta]
id = "factorio"
name = "Factorio"
version = "2.1.23"
icon = "$GAME_DIR/game/data/base/thumbnail.png"
developer = "Wube Software"
genre = "Automation / Strategy"
description = "Build and maintain automated factories on an alien planet. Factorio 2.1 Space Age (native Linux build)."

[paths]
game_dir = "/mnt/media/games/good_quality/factorio/installed/Factorio"
executable = "game/bin/x64/factorio"
working_dir = "game"
arguments = []

[runtime]
type = "native"

[graphics]
gpu = "integrated"
wayland_native = true

[graphics.gamescope]
enabled = false
mode = "embedded"
# Factorio runs directly under pure Wayland.
# Pure Wayland with the EGL interposer shim renders smoothly as com.factorio.Factorio.

[performance]
gamemode = true
mangohud = false
fps_limit = 60

[hooks]
pre_launch = ["bash -c 'if [ ! -f \"$HOME/.factorio/wayland_fix/libEGL.so.1\" ] && [ -f \"$HOME/user_scripts/apps/factorio/use_wayland/fix_run_on_wayland.py\" ]; then python3 \"$HOME/user_scripts/apps/factorio/use_wayland/fix_run_on_wayland.py\" --check; fi'"]

[env]
LD_PRELOAD = "$HOME/.factorio/wayland_fix/libEGL.so.1"
