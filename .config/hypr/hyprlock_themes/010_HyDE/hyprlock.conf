# Local Variables
source = $HOME/.config/matugen/generated/hyprlock-colors.conf

$fn_greet=echo "Good $(date +%H | awk '{if ($1 < 12) print "morning"; else if ($1 < 18) print "afternoon"; else print "evening"}'), ${USER}"

background {
    monitor =
    path = $background_image
    blur_size = 6
    blur_passes = 3
    brightness = 0.7
    color = $background
}

# TIME
label {
  monitor =
  text = $TIME12
  color = $text_color
  font_size = 90
  font_family = $font_family_clock
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:60000] date +"%A, %B %d %Y"
  color = $text_color
  font_size = 25
  font_family = $font_family_clock
  position = -30, -150
  halign = right
  valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50 #!
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = $capslock_color
    numlock_color =
    bothlock_color = # Keep the Caps Lock color when Num Lock is also active.
    invert_numlock = false # change color if numlock is off
    swap_font_color = true # see below
    position = 0, 80
    halign = center
    valign = bottom
}


# USER Greeting
label {
    monitor =
    text = cmd[update:60000] $fn_greet
    color = $entry_color
    font_size = 20
    font_family = $font_family
    position = 0, -190
    halign = center
    valign = center
}



# Battery Status if present
label {
    monitor =
    text = cmd[update:5000] "$HOME/user_scripts/hyprlock/battery_status.sh"
    color = $entry_color
    font_size = 20
    font_family = $font_family
    position = -1%, 1%
    halign = right
    valign = bottom
}

# Current Keyboard Layout 
label {
    monitor =
    text = $LAYOUT
    color = $entry_color
    font_size = 20
    font_family = $font_family
    position = 30, 30
    halign = left
    valign = bottom
}
