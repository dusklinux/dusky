source = $HOME/.config/matugen/generated/hyprlock-colors.conf

$font_family = JetBrainsMono Nerd Font
$font_weight_heavy = ExtraBold
$font_weight_light = Light

background {
    color = $background
    monitor =
    path = $background_image
    # A cinematic blur: high blur size, low passes, slight darkening
    blur_passes = 3
    blur_size = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------
# THE ACCENT BAR
# A vertical line that anchors the design to the left
# -----------------------------------------------------
shape {
    monitor =
    size = 8, 360
    color = $entry_color # Dynamic accent color from wallpaper
    rounding = 4
    rotate = 0
    position = 45, 160
    halign = left
    valign = bottom
    
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow_color
}

# -----------------------------------------------------
# TYPOGRAPHY
# -----------------------------------------------------

# HOUR (Top visual anchor - Bold)
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $text_color # High contrast light color
    font_size = 160
    font_family = $font_family $font_weight_heavy
    
    position = 70, 270
    halign = left
    valign = bottom

    shadow_passes = 3
    shadow_size = 4
    shadow_color = $shadow_color
}

# MINUTE (Bottom visual anchor - Thin/Light)
# This creates the "Stacked" look but aligned left
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $entry_color # Use the accent color for minutes
    font_size = 160
    font_family = $font_family $font_weight_light
    
    position = 70, 100
    halign = left
    valign = bottom

    shadow_passes = 3
    shadow_size = 4
    shadow_color = $shadow_color
}

# DATE & DAY (The "Subtitle")
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text_color
    font_size = 18
    font_family = $font_family
    
    position = 75, 70
    halign = left
    valign = bottom
    
    shadow_color = $shadow_color
    shadow_passes = 1
}

# -----------------------------------------------------
# STATUS WIDGETS (Top Right)
# -----------------------------------------------------

# Battery status
label {
    monitor =
    text = cmd[update:5000] "$HOME/user_scripts/hyprlock/battery_status.sh"
    color = $entry_color
    font_size = 12
    font_family = $font_family
    
    position = -30, -30
    halign = right
    valign = top
    
    shadow_color = $shadow_color
    shadow_passes = 2
}

# -----------------------------------------------------
# INPUT FIELD
# Minimalist "Ghost" Style
# -----------------------------------------------------
input-field {
    monitor =
    size = 300, 60
    # Native, event-driven Caps Lock warning.
    capslock_color = $capslock_color
    outline_thickness = 2
    
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    outer_color = $entry_color
    inner_color = $overlay_color
    font_color = $on_surface_color
    
    check_color = $check_color
    fail_color = $fail_color

    fade_on_empty = true
    placeholder_text = <i>Unlock $USER</i>
    hide_input = false
    
    position = 0, 200
    halign = center
    valign = bottom
    
    shadow_color = $shadow_color
    shadow_passes = 2
    shadow_size = 2
}
