source = $HOME/.config/matugen/generated/hyprlock-colors.conf

background {
    monitor =
    path = $background_image
    blur_size = 4
    blur_passes = 3
    brightness = 0.5
    color = $background
}

input-field {
    monitor =
    size = 300, 60
    # Native, event-driven Caps Lock warning.
    capslock_color = $capslock_color
    outline_thickness = 4
    
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = 0   # Square dots for tech look

    # Dynamic accent palette
    outer_color = $text_color
    inner_color = $overlay_color
    font_color = $tertiary_color
    check_color = $check_color
    fail_color = $fail_color

    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono NF">AUTHENTICATE_</span>
    
    position = 0, 200
    halign = center
    valign = bottom
    shadow_passes = 3
    shadow_color = $text_color
}

label {
    monitor =
    text = SYSTEM :: LOCKED
    color = $tertiary_color
    font_size = 25
    font_family = JetBrainsMono NF, Consolas
    
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 80
    font_family = JetBrainsMono NF ExtraBold

    position = 0, 100
    halign = center
    valign = center
    
    shadow_passes = 4
    shadow_size = 5
    shadow_color = $tertiary_color
}
