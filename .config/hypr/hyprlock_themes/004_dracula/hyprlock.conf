source = $HOME/.config/matugen/generated/hyprlock-colors.conf


background {
    monitor =
    path = $background_image
    blur_size = 5
    blur_passes = 2
    brightness = 0.6
    color = $background
}

input-field {
    monitor =
    size = 250, 50
    # Native, event-driven Caps Lock warning.
    capslock_color = $capslock_color
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = $secondary_color
    inner_color = $background
    font_color = $on_surface_color
    check_color = $check_color
    fail_color = $fail_color

    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    
    position = 0, 120
    halign = center
    valign = bottom
    shadow_color = $shadow_color
    shadow_passes = 2
}

label {
    monitor =
    text = $TIME
    color = $secondary_color
    font_size = 65
    font_family = JetBrainsMono Nerd Font

    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text =    $USER
    color = $tertiary_color
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 50
    halign = center
    valign = bottom
}
