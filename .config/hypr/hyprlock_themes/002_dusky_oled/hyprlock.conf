source = $HOME/.config/matugen/generated/hyprlock-colors.conf

general {
  immediate_render = true
}

background {
    monitor =
    path = # Solid palette background: skip wallpaper decoding and blur.
    blur_passes = 0
    color = $background
}

input-field {
    monitor =
    size = 250, 50
    # Native, event-driven Caps Lock warning.
    capslock_color = $capslock_color
    outline_thickness = 2
    
    # Dots Flow
    dots_size = 0.25      # Increased slightly for visibility
    dots_spacing = 0.15   # Tighter spacing feels more premium
    dots_center = true
    dots_rounding = -1    # Circle dots

    # Colors
    outer_color = $text_color
    inner_color = $surface_color
    font_color =  $text_color
    check_color = $check_color
    fail_color = $fail_color
    
    # UX
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false
    
    position = 0, 120
    halign = center
    valign = bottom
    
    # Shadow for the input field
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow_color
    shadow_boost = 1.2
}

# --- LABELS ---

label { # Current Layout (e.g. US/UK)
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 12
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
    shadow_color = $shadow_color
    shadow_passes = 2
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
    
    # Stronger shadow for the main clock to make it pop
    shadow_color = $shadow_color
    shadow_passes = 3
    shadow_size = 4
    shadow_boost = 1.3
}

label { # Date
    monitor =
    # Optimization: Update every 60 seconds (60000ms) instead of 5s. 
    # The date doesn't change that often.
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock

    position = 0, 240
    halign = center
    valign = center
    shadow_color = $shadow_color
    shadow_passes = 2
}

label { # User Info
    monitor =
    text =     $USER
    color = $text_color
    font_size = 20
    font_family = $font_family
    
    position = 0, 50
    halign = center
    valign = bottom
    shadow_color = $shadow_color
    shadow_passes = 2
}

label { # Battery Status
    monitor =
    # Update every 5s is fine for battery
    text = cmd[update:5000] "$HOME/user_scripts/hyprlock/battery_status.sh"
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
    shadow_color = $shadow_color
    shadow_passes = 2
}
