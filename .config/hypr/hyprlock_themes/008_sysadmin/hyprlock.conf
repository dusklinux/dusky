source = $HOME/.config/matugen/generated/hyprlock-colors.conf

$font_family = JetBrainsMono Nerd Font

background {
    color = $background
    monitor =
    path = $background_image
    blur_passes = 2
    blur_size = 4
    brightness = 0.5 # Darker for terminal readability
}

# HOSTNAME "FETCH"
label {
    monitor =
    text = cmd[update:0] echo "Arch Linux [Hyprland] $(uname -r)"
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}

# TIME (ASCII-ish look)
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 90
    font_family = $font_family
    position = 0, 100
    halign = center
    valign = center
}

# SYSTEM STATUS (Calls your scripts)
label {
    monitor =
    text = cmd[update:5000] "$HOME/user_scripts/hyprlock/battery_status.sh"
    color = $entry_color
    font_size = 12
    font_family = $font_family
    position = 0, -50
    halign = center
    valign = center
}

# PROMPT INPUT
input-field {
    check_color = $check_color
    fail_color = $fail_color
    monitor =
    size = 350, 40
    # Native, event-driven Caps Lock warning.
    capslock_color = $capslock_color
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = -1
    outer_color = $entry_border_color
    inner_color = $surface_color
    font_color = $text_color
    fade_on_empty = false
    placeholder_text = <span>$USER@arch:~$ input_pass</span>
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}
