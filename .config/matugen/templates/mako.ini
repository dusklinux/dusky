layer=overlay
width=150
height=44
outer-margin=0,0,0,0
margin=0,0,30,0
padding=6,14
border-size=1
border-radius=20
icons=0
text-alignment=center
font=monospace 10
format=%s
default-timeout=3000
# OVERRIDES
background-color={{colors.surface.default.hex}}99
text-color={{colors.on_surface.default.hex}}ff
border-color={{colors.outline.default.hex}}66

