# This configuration is generated by matugen
# Changing these variables with matugen still enabled will overwrite them.
# Lock wallpapers are dimmed: use the generated dark scheme in either desktop mode.

$background = {{colors.background.dark.rgba | set_alpha: 1.0}}
$text_color = rgba({{colors.primary.dark.hex_stripped}}FF)
$entry_background_color = rgba({{colors.background.dark.hex_stripped}}11)
$entry_border_color = rgba({{colors.outline.dark.hex_stripped}}55)
$entry_color = rgba({{colors.primary_fixed.dark.hex_stripped}}FF)
$font_family = Rubik
$font_family_clock = Space Grotesk DemiBold
$font_material_symbols = Material Symbols Rounded

$background_image = {{image}}

# Shared semantic roles for every lock-screen layout and authentication state.
$secondary_color = rgba({{colors.secondary.dark.hex_stripped}}FF)
$tertiary_color = rgba({{colors.tertiary.dark.hex_stripped}}FF)
$surface_color = rgba({{colors.surface_container.dark.hex_stripped}}FF)
$on_surface_color = rgba({{colors.on_surface.dark.hex_stripped}}FF)
$check_color = rgba({{colors.primary.dark.hex_stripped}}FF)
$fail_color = rgba({{colors.error.dark.hex_stripped}}FF)
$capslock_color = rgba({{colors.tertiary.dark.hex_stripped}}FF)
$shadow_color = rgba({{colors.shadow.dark.hex_stripped}}FF)
$overlay_color = rgba({{colors.surface.dark.hex_stripped}}CC)
