# =============================================================================
# 1. GTK, Qt & Core Theming
# =============================================================================

# GTK loads user CSS once. Publish complete palettes separately, and reload GTK3
# using two identically laid-out adw-gtk3 wrappers (one theme change per update).
[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/matugen/generated/gtk-3.css'
post_hook   = 'python3 "$HOME/user_scripts/theme_matugen/global/gtk_colors.py" 3'

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.config/matugen/generated/gtk-4.css'
post_hook   = 'python3 "$HOME/user_scripts/theme_matugen/global/gtk_colors.py" 4'

[templates.gtksourceview]
input_path  = '~/.config/matugen/templates/gtksourceview.xml'
output_path = '~/.config/matugen/generated/gtksourceview.xml'
post_hook   = '''
  mkdir -p "$HOME/.local/share/gtksourceview-4/styles" "$HOME/.local/share/gtksourceview-3.0/styles" "$HOME/.local/share/gtksourceview-5/styles"
  ln -nfs "$HOME/.config/matugen/generated/gtksourceview.xml" "$HOME/.local/share/gtksourceview-4/styles/matugen.xml"
  ln -nfs "$HOME/.config/matugen/generated/gtksourceview.xml" "$HOME/.local/share/gtksourceview-3.0/styles/matugen.xml"
  ln -nfs "$HOME/.config/matugen/generated/gtksourceview.xml" "$HOME/.local/share/gtksourceview-5/styles/matugen.xml"
'''

[templates.icon_theme]
input_path  = '/dev/null'
output_path = '/dev/null'
post_hook   = '''
  gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark" || :
'''

[templates.papirus-folders]
input_path = '~/.config/matugen/templates/papirus-color'
output_path = '~/.config/matugen/generated/papirus'
colors_to_compare = [
    { name = "adwaita",    color = "#93c0ea" },
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "breeze",     color = "#57b8ec" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
post_hook = '''
  if command -v papirus-folders >/dev/null 2>&1; then
    # Refresh only after recoloring and cache updates finish. A fixed delay
    # races slow machines and can leave applications showing the old icons.
    if sudo -n papirus-folders -C {{ closest_color }} --theme Papirus-Dark -u > /dev/null; then
      gsettings set org.gnome.desktop.interface icon-theme "Adwaita" 2>/dev/null || :
      gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark" 2>/dev/null || :
    else
      echo "[matugen] papirus-folders failed; retaining the current icon theme" >&2
    fi
  else
    echo "[matugen] papirus-folders not installed — install via: paru -S papirus-folders" >&2
  fi
'''

[templates.qt5ct]
input_path  = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/matugen/generated/qt5ct-colors.conf'
post_hook   = 'python3 "$HOME/user_scripts/theme_matugen/global/qt_colors.py" qt5ct'

