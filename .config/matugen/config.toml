[templates.gimp]
input_path  = '~/.config/matugen/templates/gimp.css'
output_path = '~/.config/matugen/generated/gimp.css'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/gimp.css" "$HOME/.config/GIMP/3.0/themes/Matugen/gimp.css"
  ln -nfs "$HOME/.config/matugen/generated/gimp.css" "$HOME/.config/GIMP/3.2/themes/Matugen/gimp.css"
  # Personal override for immediate effect regardless of theme selection
  ln -nfs "$HOME/.config/matugen/generated/gimp.css" "$HOME/.config/GIMP/3.2/gimp.css"
  ln -nfs "$HOME/.config/matugen/generated/gimp.css" "$HOME/.config/GIMP/3.0/gimp.css"
'''


# =============================================================================
# 2. System Components (Wayland, Bars, Notifications)
# =============================================================================

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/matugen/generated/hyprland-colors.lua'
post_hook   = 'hyprctl reload config-only || :'

[templates.hyprlock]
input_path  = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/matugen/generated/hyprlock-colors.conf'

[templates.dusky_cursor]
input_path  = '~/.config/matugen/templates/dusky-cursor.env'
output_path = '~/.config/matugen/generated/dusky-cursor.env'
post_hook   = 'python3 "$HOME/user_scripts/cursor/color/dusky_cursor.py" --apply --quiet || echo "dusky_cursor: exit $?" >&2'

# The script owns its own rotating log ($XDG_CACHE_HOME/dusky-cursor/hook.log),
# so no shell redirection is needed. --quiet keeps matugen's terminal clean
# (errors still reach stderr); a non-zero exit is surfaced instead of swallowed
# by '|| :' so a broken hook is visible in matugen's output.


[templates.waybar]
input_path  = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/waybar-colors.css'
post_hook   = '''
  pkill -USR2 -x waybar || :
'''

[templates.wlogout]
input_path  = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/wlogout-colors.css'

[templates.mako]
input_path  = '~/.config/matugen/templates/mako.ini'
output_path = '~/.config/matugen/generated/mako-colors.ini'
post_hook   = '''
