#!/hint/bash
# shellcheck disable=SC2034
# =============================================================================
#  ~/.config/pacman/makepkg.conf
#  Per-user OVERRIDE layer for ONE Arch Linux workstation.
#
#  Target : Arch rolling (kernel 7.2+) / pacman >= 7.1 / GCC 16 / LLVM 21+
#           / mold 2.4x / Rust 1.9x
#  Profile: maximum local build throughput + maximum runtime speed.
#           NOT portable. NOT reproducible. NOT redistributable. Single host.
#
#  ---------------------------------------------------------------------------
#  SOURCING ORDER  (scripts/makepkg.sh.in, pacman 7.1)
#  ---------------------------------------------------------------------------
#      1. /etc/makepkg.conf
#      2. /etc/makepkg.conf.d/*.conf      <- rust.conf, fortran.conf live HERE
#      3. THIS FILE                       <- sourced last, last writer wins
#
#  ---------------------------------------------------------------------------
#  DESIGN RULE: DELTAS ONLY.
#  ---------------------------------------------------------------------------
#  Every value identical to stock is deliberately ABSENT so that upstream keeps
#  owning it. Do NOT clone /etc/makepkg.conf into this path: a clone freezes
#  DLAGENTS, VCSCLIENTS, CARCH/CHOST, INTEGRITY_CHECK, STRIP_*, MAN_DIRS,
#  DOC_DIRS, PURGE_TARGETS, LIB_DIRS, COMPRESS*, PKGEXT/SRCEXT at the snapshot
#  date and then silently shadows every future upstream fix, forever, on a
#  rolling-release distro. That is a latent, unloggable, unbounded bug class.
#
#  Per-package escape hatches, no edits to this file required:
#      makepkg --check              re-enable check() for one build
#      makepkg --nocheck            force-disable check() for one build
#      options=(!lto !buildflags)   opt a PKGBUILD out of these flags
#      BUILDDIR=/tmp/makepkg makepkg   one-shot tmpfs build
# =============================================================================


# =============================================================================
# 1. CODE GENERATION -- C / C++
# =============================================================================
#  -march=native
#      Canonical ArchWiki recommendation for host-specific builds. Implies
#      -mtune=native. Enables the full ISA of this die (AVX2 / AVX-512 / VNNI /
#      BF16 / etc.). Binaries are permanently welded to this CPU. Accepted:
#      portability is explicitly a non-goal.
#
#  -O2 (NOT -O3)
#      Retained on purpose. GCC >= 12 already runs the vectoriser at -O2 with
#      the "very-cheap" cost model, so -O3 mostly buys aggressive loop
#      unrolling plus inlining that inflates .text and evicts the L1i cache.
#      ArchWiki and Ubuntu's distro-wide -O3 benchmark both conclude -O3 is not
#      a reliable win and regresses on real workloads. Do not "upgrade" this.
#
#  -fno-plt
#      Kills the PLT thunk for CROSS-DSO calls: the call goes straight through
#      the GOT. Already present in stock Arch.
#
#  -fno-semantic-interposition          <<< ADDED - largest single win here
#      Kills the far more expensive default on the INTRA-DSO path. Under GCC's
#      default -fsemantic-interposition a -fPIC translation unit may not inline
#      or run IPA across a call to a non-vague-linkage function in the SAME
#      shared object, because LD_PRELOAD is theoretically allowed to replace
#      it. Red Hat measured up to +27..30% on libpython from this one flag, and
#      Clang has assumed no-interposition by default since 2016. It compounds
#      with LTO. Cost: you can no longer LD_PRELOAD-override a symbol from
#      inside the very library that calls it. Nobody does that on a personal
#      workstation.
#
#  Deliberately NOT present:
#      -fno-omit-frame-pointer / -mno-omit-leaf-frame-pointer
#          Arch RFC 0026 added these distro-wide for FLEET-WIDE profiling and
#          crash triage, not for speed. They cost ~1-2% and burn a GPR. They
#          are useless on a single box that ships no debug packages.
#      -fstack-protector-strong
#          Redundant. Arch's GCC is configured --enable-default-ssp, so SSP is
#          already the compiler default. Re-specifying it is cargo cult.
#      -flto / -flto=auto
#          Never put LTO into CFLAGS. makepkg injects LTOFLAGS into CFLAGS,
#          CXXFLAGS and LDFLAGS itself when OPTIONS contains 'lto', and only
#          for packages that did not opt out via options=(!lto). Hard-coding it
#          in CFLAGS defeats every PKGBUILD's !lto escape hatch.
#
#  Hardening retained (RFC 0017 / RFC 0023 era). It is cheap, and it is not
#  where the performance is.
CFLAGS="-march=native -O2 -pipe -fno-plt -fno-semantic-interposition -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"

CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"


# =============================================================================
# 2. CODE GENERATION -- Fortran   (THE SILENT REGRESSION)
# =============================================================================
#  /etc/makepkg.conf.d/fortran.conf (Arch RFC 0054) hard-codes
#      FFLAGS="-march=x86-64 -mtune=generic -O2 ..."
#  and it is sourced AFTER /etc/makepkg.conf but BEFORE this file. Overriding
#  only CFLAGS/CXXFLAGS therefore leaves every Fortran translation unit on the
#  machine -- OpenBLAS, LAPACK, ScaLAPACK, ARPACK, SuiteSparse's Fortran
#  kernels, scipy's f2py objects -- compiled for a 2003-era baseline while the
#  C half of the very same library is compiled for your die. That is precisely
#  the numeric code with the most to gain from FMA and AVX-512. Mirror CFLAGS.
#
#  Note: RFC 0054 intentionally omits -fexceptions, -Wformat and
#  -Werror=format-security from FFLAGS (there are no C format strings in
#  Fortran). That omission is preserved here on purpose.
FFLAGS="-march=native -O2 -pipe -fno-plt -fno-semantic-interposition \
        -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection"

FCFLAGS="$FFLAGS"


# =============================================================================
# 3. LINKING -- mold
# =============================================================================
#  -fuse-ld=mold
#      The ArchWiki-canonical way to select mold, and exactly why it belongs in
#      LDFLAGS: it is a compiler-DRIVER flag, and makepkg always hands LDFLAGS
#      to gcc/g++/clang, never to ld(1) directly.
#
#  -Wl,-z,pack-relative-relocs
#      Arch RFC 0023. Emits DT_RELR instead of thousands of R_X86_64_RELATIVE
#      entries: smaller PIE binaries and materially faster dynamic startup.
#      mold has supported -z pack-relative-relocs since 1.7. Keep.
#
#  REMOVED as dead legacy (zero-legacy directive):
#      -Wl,--sort-common
#          A GNU-ld-only micro-optimisation that reduces alignment padding
#          between COMMON symbols in .bss. Dead for two independent reasons:
#          (a) -fno-common has been the GCC default since GCC 10, so tentative
#              definitions no longer become COMMON symbols at all;
#          (b) mold parses the option and discards it.
#      -Wl,-O1
#          A bfd-only knob (.dynstr merging / hash tuning). mold accepts and
#          ignores -O. Pure noise on every link line on this machine.
#
#  EVALUATED AND REJECTED (documented so nobody "improves" this later):
#      -Wl,--icf=safe    mold's safe ICF needs an .llvm_addrsig section, which
#                        GCC never emits. Against a GCC object tree it folds
#                        nothing and only costs analysis time. --icf=all is
#                        unsafe: it breaks any code comparing function pointers.
#      -Wl,--gc-sections requires -ffunction-sections -fdata-sections tree-wide
#                        and reliably breaks packages relying on link-order
#                        constructors, custom sections or --whole-archive.
#      -Wl,--compress-debug-sections=zstd
#                        no-op: this profile is !debug plus strip.
LDFLAGS="-Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,pack-relative-relocs \
         -fuse-ld=mold"


# =============================================================================
# 4. CODE GENERATION -- Rust
# =============================================================================
#  rustc does NOT read LDFLAGS. Not from the environment, not from makepkg.
#  Consequence of the previous configuration: every Rust binary on this system
#  silently lost -z relro, -z now, --as-needed and -z pack-relative-relocs. For
#  large Rust PIEs (ripgrep, alacritty, rust-analyzer, uv) DT_RELR is the single
#  biggest size and startup win available. Re-inject it explicitly through
#  -C link-arg=; rustc drives the link through cc, so -Wl, prefixes are correct.
#
#  Assigning RUSTFLAGS here fully replaces /etc/makepkg.conf.d/rust.conf, which
#  ships RUSTFLAGS="-Cforce-frame-pointers=yes". Dropping the forced frame
#  pointers is intentional and keeps Rust coherent with the C/C++ decision made
#  in section 1.
#
#  Not enabled, on purpose:
#      -C codegen-units=1  Real runtime win (~1-5%), but it serialises codegen
#                          and can double wall-clock on large crate graphs.
#                          Build throughput is a stated goal too, so this trade
#                          loses. Add it per-package if a specific binary
#                          justifies it.
#      -C lto=...          Never set LTO through RUSTFLAGS. Cargo owns LTO via
#                          the profile; forcing it here collides with Cargo's
#                          -C embed-bitcode=no and hard-fails with "lto can
#                          only be run for executables, cdylibs and static
#                          library outputs".
#      -C panic=abort      Breaks any crate using catch_unwind or #[should_panic].
RUSTFLAGS="-C target-cpu=native -C opt-level=3 \
           -C link-arg=-fuse-ld=mold \
           -C link-arg=-Wl,--as-needed \
           -C link-arg=-Wl,-z,relro \
           -C link-arg=-Wl,-z,now \
           -C link-arg=-Wl,-z,pack-relative-relocs"

DEBUG_RUSTFLAGS="-C debuginfo=2"


# =============================================================================
# 5. PARALLELISM
# =============================================================================
#  MAKEFLAGS
#    -j$(nproc)
#        nproc honours cgroup CPU quota and sched_setaffinity, so this stays
#        correct inside a systemd-run scope and under taskset.
#
#    -l$(( nproc * 3 / 2 ))                   <<< CORRECTED from -l$(nproc)
#        The old -l$(nproc) was documented as a "RAM shield preventing OOM
#        during LTO". It is neither. GNU make's -l gates on the kernel's
#        1-minute load-average EMA, which has zero correlation with RSS and
#        cannot stop an ltrans process from exhausting memory. Worse, that
#        threshold is actively counterproductive: a healthy -jN build sits at
#        load ~= N by definition, so make then refuses to spawn replacement
#        jobs and the effective job count decays below N. You paid a throughput
#        penalty for a protection you never had.
#        What -l genuinely buys is a governor against the real failure mode:
#        hand-rolled recursive Makefiles whose sub-makes do not join the
#        jobserver and each spawn N jobs of their own (the N^2 explosion).
#        1.5x nproc permits full utilisation while still catching that.
#        For ACTUAL memory containment, wrap the build instead:
#            systemd-run --user --scope -p MemoryMax=24G -p MemorySwapMax=0 \
#                makepkg -s
MAKEFLAGS="-j$(nproc) -l$(( $(nproc) * 3 / 2 ))"

#  NPROC                                       <<< ADDED (pacman 7.1, was missing)
#    New in pacman 7.1. Controls makepkg's OWN internal parallel work -- today
#    that is the parallel strip/tidy stage. Stock Arch ships a hard-coded
#    NPROC=2, so without this line the packaging stage of a large package is
#    pinned to two threads on a machine with dozens.
NPROC="$(nproc)"

#  NINJAFLAGS                                  <<< DELETED (it was a no-op)
#    Removed deliberately. It is not a makepkg.conf(5) variable; makepkg
#    exports only the documented variables to the build environment, and ninja
#    itself reads no such environment variable. It only ever did anything in
#    the handful of AUR PKGBUILDs that literally write: ninja $NINJAFLAGS
#    -- and there -j$(nproc) LOWERED parallelism, because ninja's own default
#    is nproc + 2 (deliberate oversubscription to cover link and I/O stalls).
#    Net effect of the old line: nothing, or marginally slower. Gone.


# =============================================================================
# 6. BUILD ENVIRONMENT
# =============================================================================
#  distcc  off - single machine.
#  color   on.
#  ccache  ON                                  <<< CHANGED from !ccache
#      The canonical ArchWiki "Improving build times" entry and the highest-
#      leverage change in this file for an AUR / -git workflow: 5-20x on a
#      rebuild, roughly 1-2% overhead on a cold miss. Requires the ccache
#      package (makepkg aborts if it is absent) and a raised cache size -- the
#      5 GiB default is far too small once GCC LTO IR objects are cached. See
#      the companion bootstrap script for ~/.config/ccache/ccache.conf.
#  check   OFF                                 <<< CHANGED from check
#      Running upstream test suites on every build is the single largest pure
#      build-time cost in this profile -- routinely 30-60% of wall-clock on
#      rust, llvm, gcc, python, boost and qt. It buys nothing locally: you are
#      building released tarballs that upstream CI and Arch's packagers already
#      gated. Re-enable for a single build with 'makepkg --check' whenever you
#      are bisecting a genuine -march=native miscompile.
#  sign    off - nothing leaves this host.
BUILDENV=(!distcc color ccache !check !sign)

#-- tmpfs build root. Machine-specific; enable only if the RAM is really there.
#   Rule of thumb: ~4-6x the unpacked source tree, and LTO ltrans peaks add
#   several GB on top. chromium / llvm / rust / qt6-webengine WILL OOM a 32 GB
#   box here. /tmp must not be mounted noexec. Because PKGDEST below is
#   persistent, finished packages still survive a reboot.
#BUILDDIR=/tmp/makepkg


# =============================================================================
# 7. GLOBAL PACKAGE OPTIONS
# =============================================================================
#  Stock Arch (pacman 7.1) ships:
#      OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge debug lto)
#
#  !debug    <- delta. Stock enables debug so the official repos can publish
#               -debug packages for user crash triage. Locally it doubles
#               packaging time, keeps -g through the entire compile, and writes
#               a multi-GB source copy into /usr/src/debug. Zero local value.
#  lto       <- kept. Genuine runtime win, and it is applied through LTOFLAGS
#               (stock "-flto=auto"), which correctly honours a PKGBUILD's
#               options=(!lto) opt-out. LTOFLAGS is intentionally NOT
#               overridden here because stock is already right: -flto=auto uses
#               make's jobserver when present and otherwise autodetects CPU
#               count, and Clang >= 17 accepts -flto=auto as an alias of
#               -flto=full.
#  !autodeps <- kept off, matching makepkg's own default.
#               CORRECTION TO THE PREVIOUS COMMENT: autodeps does not "skip a
#               background dependency scan". It ELF-scans the staged pkgdir and
#               auto-populates depends/provides from SONAME/NEEDED against
#               LIB_DIRS. Leaving it off is still right for local builds, but
#               the old rationale was factually wrong.
#  strip / docs / !libtool / !staticlibs / emptydirs / zipman / purge
#            <- identical to stock. Restated only because OPTIONS is an array
#               assignment and therefore replaces the whole array.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto !autodeps)


# =============================================================================
# 8. COMPRESSION
# =============================================================================
#  The compression LEVEL is deliberately left at zstd's default 3. The previous
#  reasoning was correct and is preserved verbatim in spirit: burning CPU on
#  -19 to shave a few MB off an archive that is decompressed once, five seconds
#  later, on this same disk, is a pure loss.
#
#  --auto-threads=logical                      <<< ADDED
#      Per ArchWiki: a bare -T0 binds zstd's worker count to the PHYSICAL core
#      count. On any SMT/HT part that leaves roughly 40% of achievable
#      compression throughput on the floor. --auto-threads=logical makes -T0
#      resolve against the logical CPU count instead.
COMPRESSZST=(zstd -c -T0 --auto-threads=logical -)

#  COMPRESSGZ / BZ2 / XZ / LZ4 / ... are intentionally NOT overridden: PKGEXT
#  is .pkg.tar.zst and SRCEXT is .src.tar.gz, so nothing else sits on a hot
#  path. Stock keeps ownership of them.


# =============================================================================
# 9. OUTPUT PATHS
# =============================================================================
#  SRCDEST is the one here that is genuinely a performance setting: ArchWiki
#  calls it out explicitly for VCS packages. Without it every -git rebuild
#  re-clones upstream from scratch; with it, makepkg reuses the checkout and
#  fetches only the delta. On a Hyprland / wlroots -git stack that is the
#  difference between minutes and seconds per rebuild.
#
#  PKGDEST additionally makes a tmpfs BUILDDIR safe (artifacts land on disk)
#  and lets 'paccache -rk1 -c "$PKGDEST"' garbage-collect local builds.
#
#  These directories MUST exist and be writable before the first build --
#  makepkg errors out, it does not create them. The bootstrap script does.
SRCDEST="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/src"
PKGDEST="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/pkg"
SRCPKGDEST="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/srcpkg"
LOGDEST="${XDG_CACHE_HOME:-$HOME/.cache}/makepkg/log"

#  Tags every locally built package instead of leaving "Unknown Packager".
#  That turns  expac '%n %p' | grep -F "$(id -un)@"  into an exact inventory of
#  everything on this system compiled with -march=native -- i.e. the precise
#  list you must rebuild if you ever change CPU.
PACKAGER="${USER:-$(id -un)} <${USER:-$(id -un)}@$(uname -n)>"

# vim: set ft=sh ts=2 sw=2 et:
