<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dusky Template Generator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 470px; margin: 0; padding: 12px;
    background: var(--dusky-ui-canvas); color: var(--dusky-ui-text);
    font: 13px/1.45 system-ui, sans-serif;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  h1 { flex: 1; margin: 0; font-size: 13px; color: var(--dusky-ui-primary); }
  #domain { font: 12px ui-monospace, monospace; color: var(--dusky-ui-primary); }
  #path { margin: 0 0 8px; font: 10.5px ui-monospace, monospace; color: var(--dusky-ui-muted);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #path b { color: var(--dusky-ui-primary); font-weight: 600; }
  textarea {
    width: 100%; height: 300px; resize: vertical;
    font: 11.5px/1.5 ui-monospace, monospace; color: var(--dusky-ui-text);
    background: var(--dusky-ui-field); border: 1px solid var(--dusky-ui-border); border-radius: 8px; padding: 8px;
    tab-size: 4; white-space: pre; overflow: auto;
  }
  textarea::placeholder { color: var(--dusky-ui-muted); }
  textarea:focus-visible { outline: 2px solid var(--dusky-ui-primary); outline-offset: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  button {
    display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
    font: inherit; color: var(--dusky-ui-text); background: var(--dusky-ui-control);
    border: 1px solid var(--dusky-ui-border); border-radius: 8px; padding: 7px 10px;
    cursor: pointer; text-align: left;
  }
  button:hover:not(:disabled):not(.on) { border-color: var(--dusky-ui-primary); background: var(--dusky-ui-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--dusky-ui-primary); outline-offset: 1px; }
  button .t { font-weight: 700; }
  button .s { color: var(--dusky-ui-muted); font-size: 10.5px; }
  .attention { border-color: var(--dusky-ui-primary); }
  .danger { border-color: var(--dusky-ui-error); }
  .on { background: var(--dusky-ui-primary); color: var(--dusky-ui-on-primary); border-color: var(--dusky-ui-primary); }
  .on .s { color: var(--dusky-ui-on-primary); }
  .wide { grid-column: 1 / -1; }
  .status { min-height: 2.6em; margin: 8px 0 0; font-size: 11.5px; color: var(--dusky-ui-muted); }
  .status.ok { color: var(--dusky-ui-success); } .status.err { color: var(--dusky-ui-error); }
  .status.warn { color: var(--dusky-ui-warning); } .status.busy { color: var(--dusky-ui-primary); }
  kbd { font: 10.5px ui-monospace, monospace; background: var(--dusky-ui-field);
        border: 1px solid var(--dusky-ui-border); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
  <header>
    <h1>Dusky Template Generator</h1>
    <span id="domain">…</span>
  </header>
  <p id="path"></p>
  <textarea id="css" spellcheck="false" aria-label="Template CSS"></textarea>
  <div class="grid">
    <button id="auto"><b class="t">⚡ Auto-map</b><small class="s">scan this site's colour tokens</small></button>
    <button id="pick"><b class="t">🎯 Pick elements</b><small class="s">click things on the page, assign a role</small></button>
    <button id="save" class="wide"><b class="t">💾 Saved</b><small class="s">no unsaved changes</small></button>
    <button id="copy"><b class="t">📋 Copy</b><small class="s">whole template</small></button>
    <button id="reload"><b class="t">↻ Reload</b><small class="s">re-read from disk</small></button>
    <button id="delete" class="wide danger"><b class="t">🗑 Delete</b><small class="s">remove this file from disk</small></button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <script src="theme.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
